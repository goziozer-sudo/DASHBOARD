            const row = viopData[i];
            if (!row || !row[0] || row[0].toString().trim() === '') continue;
            const ad = row[0].toString().trim();
            if (ad.toUpperCase().includes('TOPLAM') || ad.toUpperCase().includes('USDTRY')) continue;

            const hesap = (row[2] || '').toString().toUpperCase().trim();
            const kontrat = {
                satirNo:    i + 1,
                ad:         ad,
                alis:       (row[1]  || '-').toString(),
                hesap:      hesap,
                pozisyon:   (row[3]  || '').toString().toUpperCase().trim(),
                adet:       (row[4]  || '0').toString(),
                teminat:    (row[10] || row[6] || '-').toString(),
                maliyet:    (row[8]  || '-').toString(),
                guncelFiyat:(row[11] || '-').toString(),
                guncelTutar:(row[12] || '-').toString(),
                kz:         (row[13] || '-').toString(),
                karlilik:   (row[15] || '-').toString(),
                stop:       (row[20] || '-').toString(),
            };

            if (hesap.includes('SIRKET') || hesap.includes('ŞİRKET')) {
                sirketKontratlar.push(kontrat);
            } else if (hesap.includes('SAHSI') || hesap.includes('ŞAHSİ')) {
                sahsiKontratlar.push(kontrat);
            }
        }

        let acikKartlar = {};
        try { acikKartlar = JSON.parse(localStorage.getItem('pozisyon_acik_kartlar') || '{}'); } catch(e) {}

        const tumAdlar = [];
        const eklendi = {};
        sirketKontratlar.concat(sahsiKontratlar).forEach(function(k) {
            if (!eklendi[k.ad]) { tumAdlar.push(k.ad); eklendi[k.ad] = true; }
        });

        function karlilikRenk(val) {
            if (!val || val === '-') return '#fff';
            var str = val.toString().replace('%','').replace(',','.').trim();
            var num = parseFloat(str);
            if (isNaN(num)) return '#fff';
            return num >= 0 ? '#4ade80' : '#f87171';
        }

        function karlilikIkon(val) {
            if (!val || val === '-') return '';
            var str = val.toString().replace('%','').replace(',','.').trim();
            var num = parseFloat(str);
            if (isNaN(num)) return '';
            return num >= 0 ? '\u25b2' : '\u25bc';
        }

        function kzRenk(val) {
            if (!val || val === '-') return '#fff';
            var str = val.toString().replace(/[\u20ba$\u20ac\s]/g,'').replace('.','').replace(',','.').trim();
            return str.indexOf('-') !== -1 ? '#f87171' : '#4ade80';
        }

        function pozRozetRenk(poz) {
            if (poz === 'LONG') return { bg: 'rgba(34,197,94,0.2)', border: '#22c55e', text: '#4ade80' };
            if (poz === 'SHORT') return { bg: 'rgba(239,68,68,0.2)', border: '#ef4444', text: '#f87171' };
            return { bg: 'rgba(148,163,184,0.2)', border: '#94a3b8', text: '#94a3b8' };
        }

        function kartHTML(k) {
            var kartId = 'poz_' + k.hesap + '_' + k.satirNo;
            var acik = acikKartlar[kartId] === true;
            var poz = pozRozetRenk(k.pozisyon);
            var kRenk = karlilikRenk(k.karlilik);
            var kIkon = karlilikIkon(k.karlilik);
            var hesapIkon = (k.hesap.indexOf('SIRKET') !== -1 || k.hesap.indexOf('SIRKET') !== -1) ? '\ud83c\udfe2' : '\ud83d\udc64';
            var hesapAd = (k.hesap.indexOf('SIRKET') !== -1 || k.hesap.indexOf('ŞİRKET') !== -1) ? 'ŞİRKET' : 'ŞAHSİ';

            // Stop aşıldı mı?
            var stopAsild = false;
            var guncelNum = parseFloat((k.guncelFiyat || '').toString().replace(/[^\d.,-]/g,'').replace(',','.'));
            var stopNum   = parseFloat((k.stop || '').toString().replace(/[^\d.,-]/g,'').replace(',','.'));
            if (!isNaN(guncelNum) && !isNaN(stopNum) && stopNum > 0) {
                stopAsild = (k.pozisyon === 'LONG' && guncelNum < stopNum) ||
                            (k.pozisyon === 'SHORT' && guncelNum > stopNum);
            }
            var detayHTML = '';
            if (acik) {
                detayHTML = '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.15);">' +
                    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;">' +
                        '<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;">' +
                            '<div style="font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;margin-bottom:3px;">Tarih</div>' +
                            '<div style="font-size:12px;color:#fff;font-weight:600;">' + k.alis + '</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;">' +
                            '<div style="font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;margin-bottom:3px;">Adet</div>' +
                            '<div style="font-size:12px;color:#fff;font-weight:600;">' + k.adet + '</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;">' +
                            '<div style="font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;margin-bottom:3px;">Teminat</div>' +
                            '<div style="font-size:12px;color:#fff;font-weight:600;">' + k.teminat + '</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;">' +
                            '<div style="font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;margin-bottom:3px;">K/Z</div>' +
                            '<div style="font-size:12px;font-weight:700;color:' + kzRenk(k.kz) + ';">' + k.kz + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;">' +
                        '<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;">' +
                            '<div style="font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;margin-bottom:3px;">Maliyet</div>' +
                            '<div style="font-size:11px;color:#fff;font-weight:600;">' + k.maliyet + '</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;">' +
                            '<div style="font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;margin-bottom:3px;">G\u00fcncel</div>' +
                            '<div style="font-size:11px;color:#fff;font-weight:600;">' + k.guncelFiyat + '</div>' +
                        '</div>' +
                        '<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:8px;' + (stopAsild ? 'border:2px solid #ef4444;' : '') + '">' +
                            '<div style="font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;margin-bottom:3px;">Stop' + (stopAsild ? ' ⚠️' : '') + '</div>' +
                            '<div style="font-size:11px;color:#f87171;font-weight:700;">' + (k.stop !== '-' ? k.stop : '-') + '</div>' +
                        '</div>' +
                    '</div>' +
                    '<div style="display:flex;gap:6px;">' +
                        '<button onclick="showAddToContractPopup(\'' + k.ad + '\',\'' + k.adet + '\',\'' + k.maliyet + '\',\'' + hesapAd + '\',' + k.satirNo + ')" style="flex:1;background:rgba(250,248,132,0.15);border:1px solid #FAF884;color:#FAF884;padding:10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'rgba(250,248,132,0.3)\'" onmouseout="this.style.background=\'rgba(250,248,132,0.15)\'">&#10133; Ekle</button>' +
                        '<button onclick="showCloseContractPopup(\'' + k.ad + '\',\'' + k.adet + '\',\'' + hesapAd + '\',' + k.satirNo + ')" style="flex:1;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'rgba(255,255,255,0.2)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.1)\'">Kapat</button>' +
                    '</div>' +
                '</div>';
            }

            return '<div style="background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:15px;padding:18px;border:1px solid rgba(255,255,255,0.2);transition:all 0.3s ease;width:100%;box-sizing:border-box;cursor:default;" onmouseenter="this.style.background=\'rgba(255,255,255,0.15)\';" onmouseleave="this.style.background=\'rgba(255,255,255,0.1)\';" >' +
                '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
                    '<div style="display:flex;flex-direction:column;gap:4px;flex:1;">' +
                        '<div style="display:flex;align-items:center;gap:6px;">' +
                            '<span style="font-size:11px;color:#cbd5e1;font-weight:500;text-transform:uppercase;">' + k.hesap + '</span>' +
                            '<span style="background:' + poz.bg + ';border:1px solid ' + poz.border + ';color:' + poz.text + ';font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;">' + k.pozisyon + '</span>' +
                        '</div>' +
                        '<div style="font-size:13px;font-weight:700;color:#FAF884;">' + k.ad + '</div>' +
                        '<div style="display:flex;align-items:center;gap:8px;">' +
                            '<span style="font-size:12px;color:#fff;font-weight:600;">' + k.guncelTutar + '</span>' +
                            '<span style="font-size:12px;font-weight:700;color:' + kRenk + ';">' + kIkon + ' ' + k.karlilik + '</span>' +
                        '</div>' +
                    '</div>' +
                    (stopAsild ? '<span style="font-size:16px;flex-shrink:0;" title="Güncel fiyat stop seviyesini aştı!">❗</span>' : '') +
                    '<button onclick="pozisyonDanAnalizYap(\'' + k.ad + '\', this)" title="Bu pozisyon için Teknik Analiz yap" style="background:rgba(250,248,132,0.14);border:1px solid rgba(250,248,132,0.4);color:#FAF884;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;flex-shrink:0;transition:all 0.2s;">🕯️</button>' +
                    '<button onclick="togglePozKart(\'' + kartId + '\')" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#FAF884;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:700;flex-shrink:0;transition:all 0.2s;">' + (acik ? '&#9650;' : '&#9660;') + '</button>' +
                '</div>' +
                detayHTML +
            '</div>';
        }

        // Bir TL tutarini K/Z kutusundaki renkli (+yesil/-kirmizi) span'e cevirir — hem yeni
        // etiket-arama yontemi hem eski sabit-satir fallback'i ayni formati kullaniyor.
        // (29.10.2026 guncellendi) Gokhan'in istegiyle: K/Z kutusu artik TL degil USD
        // gosteriyor. OZET sayfasindaki "TOPLAM KAR ZARAR" TL cinsinden geliyor; "DATABASE'den
        // USDTRY" (marketData['USDTRY'] — sitenin her yerde kullandigi canli kur, bkz. diger
        // TL->USD cevrimleri) ile USD'ye cevriliyor. Pozisyon kartlarindan gelen son-care fallback
        // (asagida) zaten USD (VIOP sheet'i dolar bazli) oldugu icin TEKRAR cevrilmiyor — sadece
        // $ ile formatlaniyor. Hesap/mantik DEGISMEDI, sadece gosterim para birimi.
        function tlToUsdCevir(tl) {
            var kur = (typeof marketData !== 'undefined' && marketData && marketData['USDTRY']) ? marketData['USDTRY'] : 42.84;
            return tl / kur;
        }

        function kzSpanOlustur(usdToplam) {
            var renk = usdToplam >= 0 ? '#4ade80' : '#f87171';
            var prefix = usdToplam >= 0 ? '+$' : '-$';
            return '<span style="color:' + renk + ';font-weight:700;">' + prefix + Math.abs(usdToplam).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '</span>';
        }

        // (29.10.2026 duzeltildi) Gokhan'in bildirdigi hata: K/Z kutusu her zaman \u20ba0,00
        // gosteriyordu. Sebep: kod OZET sayfasinin SABIT 4./5. satirindan (I sutunu) okuyordu,
        // ama o satirlar artik BOS — gercek "TOPLAM KAR ZARAR" verisi sayfanin ALT kisimindaki
        // ayri bir mini tabloda (HESAP / TEMINAT USD / TEMINAT TL / POZISYON TL / TOPLAM KAR
        // ZARAR baslikli), ve o tablonun satir/sutun konumu da sheet'e satir eklenip
        // cikarildikca KAYABILIYOR. Ayni siniftaki hata daha once VIOP verisinde de yasanmis,
        // "sabit satira guvenme, ETIKETI ARA" yontemiyle cozulmustu (bkz. viopToplamHesapBul) —
        // ayni yontem burada da uygulandi. "TOPLAM KAR ZARAR" metni sheette baska bir yerde de
        // gecebilecegi icin (Gokhan'in uyarisi) SADECE o metni degil, ayni satirda "HESAP"
        // basliginin da bulunmasini (bu mini tabloya ozgu, daha spesifik bir imza) sart
        // kosuyoruz; birden fazla eslesme olursa sayfanin EN ALTTAKI (en guncel) tablosu
        // tercih edilir.
        function toplamKZ(liste) {
            var ozetData = window.ozetSheetData;
            var isSirket = liste.length > 0 && (liste[0].hesap.indexOf('SIRKET') !== -1 || liste[0].hesap.indexOf('ŞİRKET') !== -1);
            var hedefEtiket = isSirket ? 'ŞİRKET' : 'ŞAHSİ';

            if (ozetData && ozetData.length > 0) {
                var enSonSonuc = null;
                for (var hi = 0; hi < ozetData.length; hi++) {
                    var baslikSatiri = ozetData[hi];
                    if (!baslikSatiri) continue;
                    var hesapSutunuVarMi = baslikSatiri.some(function(h) { return (h || '').toString().trim().toUpperCase() === 'HESAP'; });
                    if (!hesapSutunuVarMi) continue;
                    var kzSutunu = -1;
                    for (var hj = 0; hj < baslikSatiri.length; hj++) {
                        if ((baslikSatiri[hj] || '').toString().trim().toUpperCase().indexOf('TOPLAM KAR') !== -1) { kzSutunu = hj; break; }
                    }
                    if (kzSutunu === -1) continue;

                    for (var ri = hi + 1; ri < Math.min(hi + 12, ozetData.length); ri++) {
                        var veriSatiri = ozetData[ri];
                        if (!veriSatiri) continue;
                        var etiketEslesti = veriSatiri.some(function(hucre) { return (hucre || '').toString().trim().toUpperCase() === hedefEtiket; });
                        if (!etiketEslesti) continue;
                        var kzRaw = (veriSatiri[kzSutunu] || '').toString();
                        var kzSign = kzRaw.indexOf('-') !== -1 ? -1 : 1;
                        var kzClean = kzRaw.replace(/[^0-9,\.]/g, '').replace(/\./g, '').replace(',', '.');
                        if (kzClean === '') continue;
                        enSonSonuc = (parseFloat(kzClean) || 0) * kzSign;
                        break;
                    }
                }
                if (enSonSonuc !== null) return kzSpanOlustur(tlToUsdCevir(enSonSonuc));

                if (ozetData.length > 4) {
                    var rowIndex = isSirket ? 4 : 3;
                    var kzRaw2 = (ozetData[rowIndex][8] || '').toString();
                    var kzSign2 = kzRaw2.indexOf('-') !== -1 ? -1 : 1;
                    var kzClean2 = kzRaw2.replace(/[^0-9,\.]/g, '').replace(/\./g, '').replace(',', '.');
                    if (kzClean2 !== '') return kzSpanOlustur(tlToUsdCevir((parseFloat(kzClean2) || 0) * kzSign2));
                }
            }
            var toplam = 0;
            var gecerli = false;
            liste.forEach(function(k) {
                var str = (k.kz || '').toString().replace(/[\u20ba$\u20ac\s.]/g,'').replace(',','.').trim();
                var num = parseFloat(str);
                if (!isNaN(num)) { toplam += num; gecerli = true; }
            });
            if (!gecerli) return '-';
            return kzSpanOlustur(toplam); // zaten USD (VIOP pozisyon verisi dolar bazli)
        }

        // Ana wrapper - her şey yatayda ortalı
        var btnSirket = '<button onclick="openYeniKontratModal(\'ŞİRKET\')" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#FAF884;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;" title="Yeni Kontrat Ekle">+</button>';
        var btnSahsi  = '<button onclick="openYeniKontratModal(\'ŞAHSİ\')" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#FAF884;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;" title="Yeni Kontrat Ekle">+</button>';

        var html = '<div style="display:flex;justify-content:center;gap:24px;width:100%;flex-wrap:wrap;">';

        // SOL SÜTUN — ŞİRKET
        html += '<div style="display:flex;flex-direction:column;align-items:stretch;gap:12px;flex:1;min-width:280px;max-width:400px;box-sizing:border-box;">';
        // Başlık + K/Z kutusu
        html += '<div style="text-align:center;font-size:12px;color:#FAF884;font-weight:700;text-transform:uppercase;margin-bottom:4px;">\u015e\u0130RKET</div>';
        html += '<div style="background:rgba(255,255,255,0.06);border-radius:15px;padding:18px;border:1px solid rgba(255,255,255,0.2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">' +
            '<div style="flex:1;text-align:center;">' +
                '<div style="font-size:11px;color:#cbd5e1;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">K/Z</div>' +
                '<div style="font-size:18px;font-weight:700;">' + toplamKZ(sirketKontratlar) + '</div>' +
            '</div>' +
            btnSirket +
        '</div>';
        // Kartlar
        sirketKontratlar.forEach(function(k) { html += kartHTML(k); });
        html += '</div>';

        // SAĞ SÜTUN — ŞAHSİ
        html += '<div style="display:flex;flex-direction:column;align-items:stretch;gap:12px;flex:1;min-width:280px;max-width:400px;box-sizing:border-box;">';
        html += '<div style="text-align:center;font-size:12px;color:#FAF884;font-weight:700;text-transform:uppercase;margin-bottom:4px;">\u015eAHS\u0130</div>';
        html += '<div style="background:rgba(255,255,255,0.06);border-radius:15px;padding:18px;border:1px solid rgba(255,255,255,0.2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">' +
            '<div style="flex:1;text-align:center;">' +
                '<div style="font-size:11px;color:#cbd5e1;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">K/Z</div>' +
                '<div style="font-size:18px;font-weight:700;">' + toplamKZ(sahsiKontratlar) + '</div>' +
            '</div>' +
            btnSahsi +
        '</div>';
        sahsiKontratlar.forEach(function(k) { html += kartHTML(k); });
        html += '</div>';

        html += '</div>';

        container.innerHTML = html;
        if (countEl) countEl.textContent = String(sirketKontratlar.length + sahsiKontratlar.length);

    } catch (e) {
        console.error('renderPozisyonlarSekmesi hata:', e);
    }
}

function togglePozKart(kartId) {
    var acikKartlar = {};
    try { acikKartlar = JSON.parse(localStorage.getItem('pozisyon_acik_kartlar') || '{}'); } catch(e) {}
    acikKartlar[kartId] = !acikKartlar[kartId];
    localStorage.setItem('pozisyon_acik_kartlar', JSON.stringify(acikKartlar));
    renderPozisyonlarSekmesi();
}

function calculateSmartAction(signal, poz) {
    function num(v) { return typeof v === 'number' ? v : parseFloat(v) || 0; }
    
    // 1. Veri Eksikliği Kontrolü (Güvenli Mod)
    const requiredFields = ['rsi', 'macd_hist', 'ma20', 'ma50', 'ma200'];
    const missing = requiredFields.filter(f => signal[f] === undefined || signal[f] === null || signal[f] === '');
    
    if (missing.length > 0) {
        return {
            action: 'BELİRSİZ',
            opportunity: null,
            score: 0,
            confidence: 0,
            drivers: [`Eksik veri: ${missing.join(', ')}`],
            miniSummary: '⚠️ Veri Eksik',
            warning: true
        };
    }

    // 2. Teknik Veriler
    const price = num(signal.fiyat || signal.price || signal.close);
    const ma20 = num(signal.ma20);
    const ma50 = num(signal.ma50);
    const ma200 = num(signal.ma200);
    const macdHist = num(signal.macd_hist);
    const rsi = num(signal.rsi);
    
    // Trend Analizi
    const trendUp = (price > ma20) && (ma20 > ma50) && (ma50 > ma200);
    const trendDown = (price < ma20) && (ma20 < ma50) && (ma50 < ma200);
    const trendSide = !trendUp && !trendDown;
    
    // Timeframe Uyum (Manuel string parse)
    const tfs = [(signal.timeframe_1h||'').toUpperCase(), (signal.timeframe_4h||'').toUpperCase(), (signal.timeframe_1d||'').toUpperCase(), (signal.timeframe_1w||'').toUpperCase()];
    const upCount = tfs.filter(t => t === 'YUKARI').length;
    const downCount = tfs.filter(t => t === 'AŞAĞI').length;
    
    // Senaryo Kontrolü
    const scenario = (signal.scenario || '').toLowerCase();
    const isBullTrap = scenario.includes('boğa tuzağı') || scenario.includes('düşüş');
    const isBearTrap = scenario.includes('ayı tuzağı') || scenario.includes('yükseliş');

    let action = 'TUT';
    let opportunity = null;
    let drivers = [];
    let score = 50;

    // 3. Mevcut Pozisyon Aksiyonu (Varsa)
    if (poz) {
        // AZALT / SAT Koşulları
        if (
            (trendDown || downCount >= 3) && 
            (macdHist < 0 || isBullTrap)
        ) {
            action = 'AZALT';
            drivers.push('Trend Aşağı', 'MACD Negatif');
            if (isBullTrap) drivers.push('Boğa Tuzağı');
            score = 30;
        }
        // EKLE Koşulları (Çelişki yasak: TrendDown yok, MACD pozitif, TF uyumlu)
        else if (
            trendUp && 
            macdHist > 0 && 
            upCount >= 3 && 
            !isBullTrap
        ) {
            action = 'EKLE';
            drivers.push('Trend Yukarı', 'MACD Pozitif', `TF ${upCount}/4`);
            score = 80;
        }
        // TUT (Varsayılan)
        else {
            action = 'TUT';
            drivers.push('Yön Belirsiz/Nötr');
        }
    }

    // 4. Yeni Fırsat (Opportunity) Analizi
    // NEW SHORT ADAYI
    if (downCount >= 3 && macdHist < 0 && (trendDown || isBullTrap)) {
        opportunity = 'NEW SHORT ADAYI';
        if (!poz) { // Pozisyon yoksa ana aksiyon bu olabilir ama şimdilik sadece etiket
            // action = 'SHORT'; 
        }
    }
    // NEW LONG ADAYI
    else if (upCount >= 3 && macdHist > 0 && (trendUp || isBearTrap)) {
        opportunity = 'NEW LONG ADAYI';
    }

    // Mini Özet İkonları
    const trendIcon = trendUp ? '⬆️' : (trendDown ? '⬇️' : '➡️');
    const macdIcon = macdHist > 0 ? '🟢' : '🔴';
    const miniSummary = `Trend ${trendIcon} | MACD ${macdIcon} | RSI ${Math.round(rsi)} | TF ${upCount}/4`;

    return {
        action,
        opportunity,
        score,
        confidence: 7, // Basit mantık
        drivers,
        miniSummary,
        warning: false
    };
}

function calculateActionScore(signal, poz, wr) {
    function num(v) { return typeof v === 'number' ? v : parseFloat(v) || 0; }
    function clamp(x) { return Math.max(0, Math.min(100, x)); }
    const base = wr && wr.finalScore ? wr.finalScore : num(signal.genel_puan) || 50;
    const tfStr = (signal.timeframe_uyum || '0/4').toString();
    const tfUp = tfStr.includes('/') ? parseInt(tfStr.split('/')[0]) || 0 : 0;
    const tfBonus = tfUp * 2.5;
    const rsi = num(signal.rsi);
    const macdHist = num(signal.macd_hist);
    let momAdj = 0;
    momAdj += Math.max(-10, Math.min(10, (rsi - 50) * 0.2));
    momAdj += Math.max(-10, Math.min(10, macdHist * 20));
    const bbUpper = num(signal.bb_upper);
    const bbLower = num(signal.bb_lower);
    const close = num(signal.close);
    let priceAdj = 0;
    if (bbUpper && bbLower && close) {
        const mid = (bbUpper + bbLower) / 2;
        priceAdj += close < mid ? 5 : -5;
        priceAdj += close < bbLower ? 5 : 0;
        priceAdj += close > bbUpper ? -5 : 0;
    }
    const sinyal = (signal.sinyal || '').toString().trim().toUpperCase();
    let signalAdj = 0;
    if (sinyal === 'AL' || sinyal === 'EKLE') signalAdj += 5;
    else if (sinyal === 'SAT' || sinyal === 'SHORT' || sinyal === 'AZALT') signalAdj -= 7;
    const kz = num(poz && poz.kz_pct);
    let kzAdj = 0;
    if (kz > 5) kzAdj += 5;
    else if (kz < -5) kzAdj -= 10;
    const gdeltNeg = num(signal.gdelt_negatif);
    const cotComm = num(signal.cot_commercial);
    let smAdj = 0;
    if (cotComm > 500) smAdj += 5;
    else if (cotComm < -500) smAdj -= 5;
    if (gdeltNeg > 50) smAdj -= 5;
    const scenario = (signal.scenario || '').toString().toLowerCase();
    const inv = num(signal.invalidation_level);
    let riskAdj = 0;
    if (scenario.includes('tuza')) riskAdj -= 5;
    if (scenario.includes('kapat') || scenario.includes('sat')) riskAdj -= 5;
    let score = clamp(base + tfBonus + momAdj + priceAdj + signalAdj + kzAdj + smAdj + riskAdj);
    const label = score >= 70 ? 'EKLE' : (score >= 50 ? 'TUT' : 'SAT');
    const color = label === 'EKLE' ? '#22c55e' : (label === 'TUT' ? '#94a3b8' : '#ef4444');
    return { score, label, color };
}

    acilAksiyonlar.sort((a, b) => {
        return (urgentPriority[a.sinyal] || 99) - (urgentPriority[b.sinyal] || 99);
    });
    
    // GÜNCEL DURUMLAR sıralaması: TUT → AL → BEKLE
    const currentPriority = { 'TUT': 1, 'LONG': 1, 'AL': 2, 'BEKLE': 3 };
    guncelDurumlar.sort((a, b) => {
        return (currentPriority[a.sinyal] || 99) - (currentPriority[b.sinyal] || 99);
    });
    
    console.log('📊 Gruplandırma:', {
        analizBekleyen: analizBekleyen.length,
        acilAksiyonlar: acilAksiyonlar.length,
        guncelDurumlar: guncelDurumlar.length
    });
    
    // ==================== GRUPLARI EKLE ====================
    
    // 1) ANALİZ BEKLENİYOR (Boş sinyal)
    if (analizBekleyen.length > 0) {
        const group = createSignalGroup('ANALİZ BEKLENİYOR', analizBekleyen, 'pending');
        container.appendChild(group);
    }
    
    // 2) ACİL AKSIYONLAR
    if (acilAksiyonlar.length > 0) {
        const group = createSignalGroup('ACİL AKSIYONLAR', acilAksiyonlar, 'urgent');
        container.appendChild(group);
    }
    
    // 3) GÜNCEL DURUMLAR - BAŞLIKSIZ (Direkt kartları ekle)
    if (guncelDurumlar.length > 0) {
        // Grid container oluştur
        const gridContainer = document.createElement('div');
        gridContainer.style.cssText = `
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
            max-width: 100%;
        `;
        
        // Kartları direkt ekle (başlık yok)
        guncelDurumlar.forEach(signal => {
            const row = createCompactSignalRow(signal);
            gridContainer.appendChild(row);
        });
        
        container.appendChild(gridContainer);
    }
    
    // ✅ TÜM ACCORDION'LARI KAPAT (İlk yüklemede açık gelmemesi için)
    setTimeout(() => {
        document.querySelectorAll('[id^="signal-"]:not([id*="toggle"])').forEach(acc => {
            if (acc.style.maxHeight !== '0' && acc.style.maxHeight !== '0px') {
                acc.style.maxHeight = '0';
            }
        });
    }, 100);
}

// YENİ: Sinyal grubu oluştur (GRUP BAŞLIKLARI + ALT ALTA SATIRLAR)
function createSignalGroup(title, signals, groupType) {
    const group = document.createElement('div');
    group.style.cssText = 'margin-bottom: 24px;';
    
    // Grup renklerini belirle
    let bgColor, borderColor;
    
    if (groupType === 'urgent') {
        bgColor = 'rgba(239, 68, 68, 0.1)';
        borderColor = '#ef4444';
    } else if (groupType === 'pending') {
        bgColor = 'rgba(251, 191, 36, 0.1)';
        borderColor = '#fbbf24';
    } else {
        bgColor = 'rgba(74, 222, 128, 0.1)';
        borderColor = '#4ade80';
    }
    
    const header = document.createElement('div');
    header.style.cssText = `
        font-size: 18px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 16px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-left: 4px solid ${borderColor};
        border-radius: 8px;
    `;
    header.textContent = `${title} (${signals.length})`;
    group.appendChild(header);
    
    // YENİ: Flex container oluştur (YAN YANA, SOLA YASLI)
    const gridContainer = document.createElement('div');
    gridContainer.style.cssText = `
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 0;
        max-width: 100%;
        justify-content: flex-start;
        align-items: flex-start;
    `;
    
    // Kompakt satırları grid container'a ekle (YAN YANA)
    signals.forEach(signal => {
        const row = createCompactSignalRow(signal);
        gridContainer.appendChild(row);
        
        // ✅ ACCORDION'U ZORLA KAPAT (DOM'a eklendikten HEMEN SONRA)
        const accordions = row.querySelectorAll('[id^="signal-"]:not([id*="toggle"])');
        accordions.forEach(acc => {
            acc.style.maxHeight = '0';
        });
    });
    
    group.appendChild(gridContainer);
    
    return group;
}

// Trend ikonu helper
function getTrendIcon(trend) {
    if (!trend) return '→';
    const t = trend.toUpperCase();
    if (t === 'YUKARI' || t === 'UP' || t === 'YUKSELIŞ') return '↗️';
    if (t === 'ASAGI' || t === 'DOWN' || t === 'DÜŞÜŞ') return '↘️';
    return '→';
}

// Yeni accordion toggle (detail bölümleri için)
function toggleAccordionDetail(id) {
    const content = document.getElementById(id);
    const btn = content ? content.previousElementSibling : null;
    const icon = btn ? btn.querySelector('.accordion-icon') : null;
    
    if (!content || !btn || !icon) return;
    
    // Toggle
    if (content.style.maxHeight && content.style.maxHeight !== '0px') {
        content.style.maxHeight = '0';
        icon.textContent = '▼';
    } else {
        content.style.maxHeight = content.scrollHeight + 'px';
        icon.textContent = '▲';
    }
}

// ==================== MODAL FONKSİYONLARI BİTİŞ ====================

// Accordion toggle (NEDEN BU SİNYAL için - YENİ)
function toggleDetailAccordion(id) {
    const content = document.getElementById(id);
    const header = content ? content.previousElementSibling : null;
    const icon = header ? header.querySelector('.accordion-icon') : null;
    
    if (!content || !header || !icon) return;
    
    // Aktif/pasif durumu toggle et
    if (content.classList.contains('active')) {
        content.classList.remove('active');
        header.classList.remove('active');
        icon.textContent = '▼';
        // ✅ KAPALI durumda sıfırla
        content.style.maxHeight = '0';
        content.style.overflowY = 'hidden';
        content.style.padding = '0 15px';
    } else {
        content.classList.add('active');
        header.classList.add('active');
        icon.textContent = '▲';
        // ✅ AÇIK durumda scroll aktif
        content.style.maxHeight = content.scrollHeight + 'px';
        content.style.overflowY = 'auto';
        content.style.padding = '15px';
    }
}

// ✅ YENİ: MUM FORMASYON ANALİZİ TETİKLEME
async function runCandleAnalysis(ticker) {
    if (!confirm(ticker + ' için Mum Formasyon Analizi başlatılacak. Devam etmek istiyor musunuz?')) return;
    
    const btn = event.target.closest('button'); // Butonu yakala (icon içinde olsa bile)
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analiz Yapılıyor...';
    btn.disabled = true;
    
    try {
        const url = `${APPS_SCRIPT_URL}?action=analyzeCandlePatterns&ticker=${ticker}&_=${Date.now()}`;
        const response = await fetch(url);
        const result = await response.json();
        
        if (result.status === 'success') {
            const foundPattern = result.lastResult ? result.lastResult.pattern : 'Yok';
            alert(`✅ Analiz Tamamlandı!\n\nBulunan Formasyon: ${foundPattern}`);
            
            // Verileri yenile
            loadSignals(); 
        } else {
            alert('❌ Hata: ' + result.message);
        }
    } catch (error) {
        console.error(error);
        alert('❌ Bağlantı hatası: ' + error.message);
    } finally {
        if (btn) {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
}

// Sebep metnini formatla (başlıkları HTML'e çevir)
function formatSebepWithHeaders(sebep) {
    if (!sebep || sebep.trim() === '') return 'Analiz bekleniyor...';
    
    let formatted = sebep;
    
    // Markdown-style başlıkları HTML h5'e çevir
    // Örnek: "## Başlık" veya "**Başlık:**" → <h5>Başlık</h5>
    
    // 1. Markdown başlıkları (## Başlık)
    formatted = formatted.replace(/^##\s+(.+)$/gm, '<h5>$1</h5>');
    formatted = formatted.replace(/^#\s+(.+)$/gm, '<h5>$1</h5>');
    
    // 2. Bold başlıklar (**Başlık:** veya **Başlık**)
    formatted = formatted.replace(/\*\*([^*]+?):?\*\*/g, '<h5>$1</h5>');
    
    // 3. Emoji başlıklar (📊 Başlık:)
    formatted = formatted.replace(/^([\u{1F300}-\u{1F9FF}]\s+[^:\n]+):$/gmu, '<h5>$1</h5>');
    
    // 4. Satır atlamalarını <br> ile değiştir (white-space: pre-wrap olduğu için gereksiz ama yedek)
    // formatted = formatted.replace(/\n/g, '<br>');
    
    return formatted;
}

// Sinyal nedenleri oluştur
function generateSignalReasons(signal) {
    const reasons = [];
    
    // ⭐ ÖNCELİK: SIGNALS'tan gelen SEBEP varsa onu göster
    if (signal.sebep && signal.sebep !== '') {
        // Sebep metnini formatla (başlıkları HTML'e çevir)
        const formattedSebep = formatSebepWithHeaders(signal.sebep);
        
        // Sebep-formatli div'e wrap et (white-space: pre-wrap için)
        let content = '<div class="sebep-formatli">' + formattedSebep + '</div>';
        
        // Makro skor varsa ekle
        if (signal.makroSkor && signal.makroSkor !== '') {
            content += '<br>• <strong>Makro Ekonomik Güç</strong>: ' + signal.makroSkor + '/100';
        }
        
        // Haftalık trend varsa ekle
        if (signal.haftalikTrend && signal.haftalikTrend !== '') {
            const trendIcon = signal.haftalikTrend === 'YUKARI' ? '📈' : 
                            signal.haftalikTrend === 'ASAGI' ? '📉' : '➡️';
            content += '<br>• <strong>Haftalık Trend</strong>: ' + trendIcon + ' ' + signal.haftalikTrend;
        }
        
        // Smart Money notu varsa ekle
        if (signal.smartMoneyNotu && signal.smartMoneyNotu !== '') {
            content += '<br>• <strong>💰 Smart Money</strong>: ' + signal.smartMoneyNotu;
        }
        
        return content;
    }
    
    // ⭐ YEDEK: SIGNALS'ta sebep yoksa teknik analiz göster
    
    // RSI analizi
    if (signal.rsi < 30) {
        reasons.push('• <strong>RSI Aşırı Satım</strong>: RSI ' + signal.rsi.toFixed(1) + ' seviyesinde. Yukarı dönüş bekleniyor.');
    } else if (signal.rsi > 70) {
        reasons.push('• <strong>RSI Aşırı Alım</strong>: RSI ' + signal.rsi.toFixed(1) + ' seviyesinde. Düzeltme riski var.');
    }
    
    // MACD analizi - DÜZELTILDI: Line vs Histogram ayrımı
    const macdLine = signal.macdValue;
    const macdSignal = signal.macdSignal;
    const macdHist = signal.macdHist;
    
    if (macdLine > 0 && macdHist < 0) {
        // MACD Line pozitif AMA histogram negatif
        reasons.push(
            '• <strong>MACD Line</strong>: ' + macdLine.toFixed(2) + ' (Pozitif, trend yukarı)<br>' +
            '• <strong>Histogram</strong>: ' + macdHist.toFixed(2) + ' (Momentum hafif zayıflıyor)<br>' +
            '• <strong>Sonuç</strong>: Trend yukarı ama dikkatli izle'
        );
    } else if (macdLine > 0 && macdHist > 0) {
        // Her ikisi de pozitif - güçlü yükseliş
        reasons.push(
            '• <strong>MACD Line</strong>: ' + macdLine.toFixed(2) + ' (Pozitif)<br>' +
            '• <strong>Histogram</strong>: +' + macdHist.toFixed(2) + ' (Pozitif)<br>' +
            '• <strong>Sonuç</strong>: Güçlü yükseliş trendi!'
        );
    } else if (macdLine < 0 && macdHist > 0) {
        // MACD Line negatif AMA histogram pozitif - dönüş sinyali
        reasons.push(
            '• <strong>MACD Line</strong>: ' + macdLine.toFixed(2) + ' (Negatif)<br>' +
            '• <strong>Histogram</strong>: +' + macdHist.toFixed(2) + ' (Pozitif dönüş)<br>' +
            '• <strong>Sonuç</strong>: Yukarı dönüş başlıyor olabilir'
        );
    } else if (macdLine < 0 && macdHist < 0) {
        // Her ikisi de negatif - güçlü düşüş
        reasons.push(
            '• <strong>MACD Line</strong>: ' + macdLine.toFixed(2) + ' (Negatif)<br>' +
            '• <strong>Histogram</strong>: ' + macdHist.toFixed(2) + ' (Negatif)<br>' +
            '• <strong>Sonuç</strong>: Düşüş baskısı devam ediyor'
        );
    }
    
    // EMA analizi - DÜZELTILDI: Sıralama ve destek seviyesi
    const ema20 = signal.ma20;
    const ema50 = signal.ma50;
    const ema200 = signal.ma200;
    const fiyat = signal.fiyat;
    
    // EMA sıralaması kontrolü
    if (fiyat > ema20 && ema20 > ema50 && ema50 > ema200) {
        reasons.push(
            '• <strong>EMA Sıralaması</strong>: Fiyat > EMA20 > EMA50 > EMA200<br>' +
            '  Bu güçlü yükseliş trendi göstergesi!<br>' +
            '• <strong>Destek</strong>: ' + formatPrice(ema20) + ' (EMA20)'
        );
    } else if (fiyat > ema20 && fiyat > ema50) {
        reasons.push(
            '• <strong>EMA Desteği</strong>: Fiyat EMA20 ve EMA50 üzerinde<br>' +
            '  Trend yukarı yönlü<br>' +
            '• <strong>Destek</strong>: ' + formatPrice(ema20) + ' (EMA20)'
        );
    } else if (fiyat < ema20 && fiyat < ema50 && fiyat < ema200) {
        reasons.push(
            '• <strong>EMA Direnci</strong>: Fiyat tüm EMA\'ların altında<br>' +
            '  Güçlü düşüş trendi<br>' +
            '• <strong>Direnç</strong>: ' + formatPrice(ema20) + ' (EMA20)'
        );
    } else if (fiyat < ema20 && fiyat < ema50) {
        reasons.push('• <strong>EMA Direnci</strong>: Fiyat EMA20 ve EMA50 altında. Trend aşağı yönlü.');
    }
    
    // Bollinger analizi
    if (signal.fiyat >= signal.bbUpper) {
        reasons.push('• <strong>Bollinger Üst Bant</strong>: Fiyat üst banda ulaştı. Aşırı alım bölgesi.');
    } else if (signal.fiyat <= signal.bbLower) {
        reasons.push('• <strong>Bollinger Alt Bant</strong>: Fiyat alt banda ulaştı. Aşırı satım bölgesi.');
    }
    
    // Kar/Zarar durumu
    if (signal.karZararPct > 10) {
        reasons.push('• <strong>Yüksek Kar</strong>: %' + signal.karZararPct.toFixed(2) + ' kârdasınız. Kar kilitleme zamanı.');
    } else if (signal.karZararPct < -5) {
        reasons.push('• <strong>Zarar Durumu</strong>: %' + signal.karZararPct.toFixed(2) + ' zarardayken, ortalama düşürme fırsatı.');
    }
    
    if (reasons.length === 0) {
        reasons.push('• Teknik göstergeler nötr seviyede.');
    }
    
    return '<div style="font-size: 13px; color: #e2e8f0; line-height: 1.8;">' + reasons.join('<br>') + '</div>';
}

// Aksiyon önerileri oluştur
function generateActionSuggestions(signal) {
    const suggestions = [];
    
    if (signal.sinyal === 'SAT') {
        const stopLoss = signal.fiyat * 0.95; // %5 altı
        const target = signal.fiyat * 1.05; // Geçerli hedef yok, şu anki fiyat
        
        suggestions.push(`• <strong>Stop Loss</strong>: ${formatPrice(stopLoss)} seviyesinde koruma koyun.`);
        suggestions.push('• <strong>Kar Realizasyonu</strong>: Pozisyonun %50-70\'ini kapatabilirsiniz.');
        suggestions.push('• <strong>Takip</strong>: Kalan pozisyon için trailing stop kullanın.');
    } else if (signal.sinyal === 'KISMİ_SAT') {
        suggestions.push('• <strong>Kısmi Satış</strong>: Pozisyonun %30-40\'ını satarak kar kilitleyin.');
        suggestions.push('• <strong>Geri Kalan</strong>: %60-70\'ini tutarak trend devamından yararlanın.');
        suggestions.push(`• <strong>Stop Loss</strong>: ${formatPrice(signal.fiyat * 0.97)} seviyesinde koruma.`);
    } else if (signal.sinyal === 'EKLE' || signal.sinyal === 'AL') {
        const entry = signal.fiyat;
        const stopLoss = signal.fiyat * 0.95;
        const target = signal.fiyat * 1.10;
        
        suggestions.push(`• <strong>Giriş</strong>: ${formatPrice(entry)} seviyesinden pozisyon alabilirsiniz.`);
        suggestions.push(`• <strong>Stop Loss</strong>: ${formatPrice(stopLoss)} (%5 altı)`);
        suggestions.push(`• <strong>Hedef</strong>: ${formatPrice(target)} (%10 üstü)`);
    } else if (signal.sinyal === 'TUT') {
        // TUT sinyali - DÜZELTILDI: Detaylı hedefler ve stop loss
        const currentPrice = signal.fiyat;
        const stopLoss = currentPrice * 0.995; // %0.5 altı (sıkı stop)
        const target1 = currentPrice * 1.025; // %2.5 üstü
        const target2 = currentPrice * 1.05;  // %5 üstü
        
        suggestions.push('✅ <strong>ŞUAN</strong>: TUT (Trend yukarı, pozisyon koru)');
        suggestions.push('🛡️ <strong>Stop Loss</strong>: ' + formatPrice(stopLoss) + ' (%0.5 altı, sıkı koruma)');
        suggestions.push('🎯 <strong>Hedef 1</strong>: ' + formatPrice(target1) + ' (%2.5 üstü) → Pozisyonun %30\'unu sat');
        suggestions.push('🎯 <strong>Hedef 2</strong>: ' + formatPrice(target2) + ' (%5 üstü) → Pozisyonun %50\'sini sat');
        suggestions.push('⚠️ <strong>RSI 70 geçerse</strong>: Kısmi satış yap (aşırı alım riski)');
        suggestions.push('📊 <strong>EMA20 Destek</strong>: ' + formatPrice(signal.ma20) + ' seviyesini izle');
    } else if (signal.sinyal === 'BEKLE') {
        suggestions.push('• <strong>Sabır</strong>: Henüz net sinyal yok, aceleci işlem yapmayın.');
        suggestions.push('• <strong>İzle</strong>: RSI 30 altı veya 70 üstü için alarm kurun.');
        suggestions.push('• <strong>Hazırlık</strong>: Diğer kontratları değerlendirin.');
    }
    
    return '<div style="font-size: 13px; color: #e2e8f0; line-height: 1.8;">' + suggestions.join('<br>') + '</div>';
}

// Sinyal kartı oluştur (ESKİ - YEDEKLENDİ)
function createSignalCard(signal) {
    const card = document.createElement('div');
    
    // ⭐ Sinyal kontrolü: Boşsa pending, doluysa active
    const isPending = !signal.sinyal || signal.sinyal === '';

    const displaySignal = isPending ? '⏳ ANALİZ BEKLENİYOR' : signal.sinyal;
    
    card.className = `signal-card ${cardClass} ${displaySignal}`;
    
    // Kar/Zarar rengi
    const kzColor = signal.karZararPct >= 0 ? '#4ade80' : '#ef4444';
    
    // RSI durumu
    let rsiStatus = 'Nötr';
    let rsiColor = '#94a3b8';
    if (signal.rsi < 30) { rsiStatus = 'Aşırı Satım'; rsiColor = '#4ade80'; }
    else if (signal.rsi > 70) { rsiStatus = 'Aşırı Alım'; rsiColor = '#f87171'; }
    
    // MACD durumu ve DEBUG
    const macdTrend = signal.macdHist > 0 ? '↗️ Yükseliş' : '↘️ Düşüş';
    
    // MACD = 0 uyarısı
    if (Math.abs(signal.macdValue - signal.macdSignal) < 0.01) {
        console.warn('⚠️ MACD UYARI:', {
            ticker: signal.ticker,
            macdValue: signal.macdValue,
            macdSignal: signal.macdSignal,
            macdHist: signal.macdHist,
            message: 'MACD Value ve Signal neredeyse eşit! Kesişim noktası.'
        });
    }

// VİOP maliyetini bul
function getMaliyetFromViop(kontratAdi) {
    if (!viopData || viopData.length < 2) return null;
    
    const kontratUpper = kontratAdi.toUpperCase().trim();
    
    // VIOPKONTRATLAR sayfasında ara
    for (let i = 1; i < viopData.length && i <= 10; i++) {
        const row = viopData[i];
        if (!row || !row[0]) continue;
        
        const viopKontrat = row[0].toString().toUpperCase().trim();
        
        if (viopKontrat === kontratUpper) {
            // Maliyet sütunu: I (index 8)
            const maliyet = parseNumberSmart(row[8]) || 0;
            if (maliyet > 0) {
                console.log(`✅ Maliyet bulundu: ${kontratAdi} = ${maliyet}`);
                return maliyet;
            }
        }
    }
    
    console.log(`⚠️ Maliyet bulunamadı: ${kontratAdi}`);
    return null;
}

// Öneri oluştur
function generateOneri(signal, maliyet, fark) {
    if (!maliyet || !fark) return null;
    
    const farkNum = parseFloat(fark);
    
    if (signal.sinyal === 'AL') {
        if (farkNum < -5) {
            return '⭐ EKLE - Fiyat maliyetinizin %5 altında! Ortalama düşürmek için fırsat.';
        } else if (farkNum < 0) {
            return '✅ İYİ FİYAT - Maliyetinizin altında, giriş yapılabilir.';
        } else {
            return '⚠️ DİKKAT - Fiyat maliyetinizin üstünde, beklemek daha iyi olabilir.';
        }
    } else if (signal.sinyal === 'SAT') {
        if (farkNum > 5) {
            return '💰 KAR REALİZASYONU - Fiyat maliyetinizin %5 üstünde! Kar almak için uygun.';
        } else if (farkNum > 0) {
            return '✅ KARDA - Pozitif farkla çıkış yapabilirsiniz.';
        } else {
            return '⚠️ ZARARDA - Stop loss değerlendirin.';
        }
    } else if (signal.sinyal === 'BEKLE') {
        return '⏸️ BEKLE - Trend belirsiz, pozisyon almak için henüz erken.';
    }
    
    return null;
}

// Fiyat formatla
function formatPrice(price) {
    if (!price) return '-';
    
    // 3 basamak ve üzeri: ondalık yok
    // 3 basamaktan küçük: 2 ondalık
    const decimals = Math.abs(price) >= 100 ? 0 : 2;
    
    return '$' + price.toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
    });
}

// Teknik göstergeler için formatlama (RSI, EMA, Bollinger)
// (28.10.2026 güncellendi) Gökhan'ın isteğiyle sona '$' para birimi eklendi — bu fonksiyon
// SADECE fiyat gösteren 4 yerde kullanılıyor (GÜNCEL FİYAT, Maliyet, HEDEF, STOP; GİRİŞ FİYATI
// da aynısını kullanıyor), RSI/EMA/skor gibi fiyat OLMAYAN hiçbir yerde çağrılmıyor — kontrol
// edildi, güvenli. '-' (veri yok) durumunda $ EKLENMEZ.
function formatNumberTeknik(value, decimals = 2) {
    if (!value && value !== 0) return '-';

    // 100'den büyükse binlik ayraç ekle
    if (Math.abs(value) >= 100) {
        return value.toLocaleString('en-US', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        }) + '$';
    }

    // 100'den küçükse sadece ondalık
    return value.toFixed(decimals) + '$';
}

// YENİ: SEBEP DETAYLI PARSE FONKSİYONU (GELİŞTİRİLMİŞ)
function formatSebepDetayli(sebep) {
    console.log('🔥 formatSebepDetayli ÇAĞRILDI!');
    console.log('📄 sebep değeri:', sebep ? sebep.substring(0, 100) : 'BOŞ');
    
    if (!sebep) return '<span style="color: #94a3b8;">Sebep bilgisi yok</span>';
    
    let html = '';

    if (sebep.includes('SON 5 MUM:')) {
        const mumMatch = sebep.match(/SON 5 MUM:\s*([^\n]+)/i);
        if (mumMatch && mumMatch[1]) {
            html += `
                <div style="margin-bottom: 12px; padding: 15px; background: rgba(59, 130, 246, 0.15); border-radius: 8px; border-left: 3px solid #3b82f6;">

                        ${mumMatch[1].trim()}
                    </div>
                </div>
            `;
        }
    }
    
    // [MAKRO] kısmını detaylı parse et
    const makroMatch = sebep.match(/\[MAKRO\]:\s*([^\[]+)/);
    if (makroMatch) {
        const makroText = makroMatch[1];
        const toplamMatch = makroText.match(/Toplam:\s*(\d+)\/100/);
        const toplam = toplamMatch ? toplamMatch[1] : '?';

    // [TIMEFRAME] kısmını parse et
    const tfMatch = sebep.match(/\[TIMEFRAME\]:\s*([^\[]+)/);
    if (tfMatch) {
        const tf = tfMatch[1].trim();
        const tfColor = tf.includes('4/4') ? '#22c55e' : (tf.includes('3/4') ? '#f59e0b' : '#ef4444');

                <div style="color: #cbd5e1; font-size: 11px; line-height: 1.5;">${tf}</div>
            </div>
        `;
    }
    
    // [SMART MONEY] kısmını parse et
    const smMatch = sebep.match(/\[SMART MONEY\]:\s*([^\[]+)/);
    if (smMatch) {
        const sm = smMatch[1].trim();
        let smColor = '#94a3b8';
        let smBg = 'rgba(30, 58, 138, 0.15)';
        
        if (sm.includes('ALIYOR')) {
            smColor = '#22c55e';
            smBg = 'rgba(34, 197, 94, 0.15)';

            smColor = '#ef4444';
            smBg = 'rgba(239, 68, 68, 0.15)';
        } else if (sm.includes('BEKLEMEDE')) {

            smBg = 'rgba(245, 158, 11, 0.15)';

        html += `
            <div style="margin-bottom: 12px; padding: 10px; background: ${smBg}; border-radius: 8px; border-left: 3px solid ${smColor};">
                <div style="color: ${smColor}; font-weight: 700; font-size: 13px; margin-bottom: 4px;">💰 SMART MONEY</div>
                <div style="color: #e2e8f0; font-size: 12px; font-weight: 600;">${sm}</div>
            </div>
        `;
    }
    
    // [MUM] kısmını parse et
    const mumMatch = sebep.match(/\[MUM\]:\s*([^\[]+)/);
    if (mumMatch) {
        html += `
            <div style="margin-bottom: 12px; padding: 10px; background: rgba(30, 58, 138, 0.15); border-radius: 8px; border-left: 3px solid #8b5cf6;">
                <div style="color: #8b5cf6; font-weight: 700; font-size: 13px; margin-bottom: 4px;">🕯️ MUM PATTERN</div>

    // [TEKNİK] kısmını detaylı parse et
    const teknikMatch = sebep.match(/\[TEKNIK\]:\s*([^\[]+)/);
    if (teknikMatch) {
        html += `
            <div style="margin-bottom: 12px; padding: 10px; background: rgba(30, 58, 138, 0.15); border-radius: 8px; border-left: 3px solid #06b6d4;">
                <div style="color: #06b6d4; font-weight: 700; font-size: 13px; margin-bottom: 6px;">📈 TEKNİK</div>
                <div style="color: #cbd5e1; font-size: 11px; line-height: 1.6;">
        `;
        
        // Teknik göstergeleri ayır ve listele
        const teknikText = teknikMatch[1].trim();
        const parts = teknikText.split(',');
        parts.forEach(part => {
            html += `<div style="padding: 2px 0; padding-left: 8px;">• ${part.trim()}</div>`;
        });
        
        html += `

    // [SONUÇ] veya [SONUC] kısmını parse et
    const sonucMatch = sebep.match(/\[SONUC?\]:\s*(.+)/);
    if (sonucMatch) {
        html += `
            <div style="margin-bottom: 0; padding: 12px; background: rgba(34, 197, 94, 0.15); border-radius: 8px; border-left: 3px solid #22c55e;">

    }
    
    // Eğer hiçbir match yoksa (eski format), direkt göster
    if (!html) {
        html = `<div style="color: #cbd5e1; font-size: 11px; line-height: 1.5;">${sebep}</div>`;
    }
    
    return html;
}

// AKILLI SİNYAL HESAPLAMA (YENİ MANTIK)
function calculateSmartSignal(signal) {
    const karPct = signal.karZararPct || 0;
    const rsi = signal.rsi || 50;
    const macdHist = signal.macdHist || 0;
    const fiyat = signal.fiyat || 0;
    const ma20 = signal.ma20 || 0;
    const ma50 = signal.ma50 || 0;
    
    // MACD negatif dönüş kontrolü (histogram 0'dan küçük)
    const macdNegative = macdHist < 0;
    
    // Momentum kontrolü (MACD pozitif ve güçlü)
    const strongMomentum = macdHist > 0 && Math.abs(macdHist) > 10;
    
    // Trend yukarı mı? (Fiyat EMA20 ve EMA50 üstünde)
    const trendUp = fiyat > ma20 && fiyat > ma50;
    
    // Stop loss seviyesi (Örnek: %2 altı)
    const stopLoss = signal.maliyet * 0.98;
    
    console.log('📊 Sinyal Hesaplama:', {
        ticker: signal.ticker,
        karPct: karPct.toFixed(2) + '%',
        rsi: rsi.toFixed(1),
        macdValue: signal.macdValue.toFixed(3),
        macdSignal: signal.macdSignal.toFixed(3),
        macdHist: macdHist.toFixed(3),
        macdLine: (signal.macdValue || 0).toFixed(3),
        macdNegative: macdNegative,
        strongMomentum: strongMomentum,
        trendUp: trendUp,
        fiyat: fiyat.toFixed(2),
        ma20: ma20.toFixed(2),
        fiyatVsMA20: (fiyat > ma20),
        stopLoss: stopLoss.toFixed(0),
        warning: '⚠️ RSI ve MACD değerleri TradingView webhook\'ünden geliyor. Yahoo Finance ile karşılaştır!',
        debug: '🔍 TUT kontrolü: macdLine=' + (signal.macdValue || 0).toFixed(3) + ' > 0? ' + ((signal.macdValue || 0) > 0) + ', fiyat=' + fiyat.toFixed(2) + ' > ma20=' + ma20.toFixed(2) + '? ' + (fiyat > ma20)
    });
    
    // 1. SAT SİNYALİ: Kâr >%5 VE (RSI>70 VEYA MACD negatif dönüş)
    if (karPct > 5 && (rsi > 70 || macdNegative)) {
        console.log('✅ SAT sinyali: Kâr=' + karPct.toFixed(2) + '%, RSI=' + rsi + ', MACD Hist=' + macdHist.toFixed(3));
        return 'SAT';
    }
    console.log('❌ SAT kontrolü geçildi: karPct=' + karPct.toFixed(2) + ' <= 5 VEYA (rsi=' + rsi + ' <= 70 VE macdHist=' + macdHist.toFixed(3) + ' >= 0)');
    
    // 2. TUT SİNYALİ: MACD Line pozitif VE fiyat>EMA20 (ÖNCELİK: BEKLE'den önce!)
    // DÜZELTME: MACD Line (macdValue) kontrolü, histogram değil!
    const macdLine = signal.macdValue || 0;
    
    console.log('🔍 TUT kontrolü başlıyor: macdLine=' + macdLine.toFixed(3) + ' > 0? ' + (macdLine > 0) + ', fiyat=' + fiyat.toFixed(2) + ' > ma20=' + ma20.toFixed(2) + '? ' + (fiyat > ma20));
    
    if (macdLine > 0 && fiyat > ma20) {
        console.log('✅ TUT sinyali: MACD Line pozitif (' + macdLine.toFixed(3) + '), Fiyat>EMA20, Histogram=' + macdHist.toFixed(3));
        return 'TUT';
    }
    console.log('❌ TUT kontrolü BAŞARISIZ: macdLine=' + macdLine.toFixed(3) + ' <= 0 VEYA fiyat=' + fiyat.toFixed(2) + ' <= ma20=' + ma20.toFixed(2));
    
    // 3. BEKLE SİNYALİ: Kâr %1-5 arası VE trend yukarı VE RSI<70
    if (karPct >= 1 && karPct <= 5 && trendUp && rsi < 70) {
        console.log('⏸️ BEKLE sinyali: Kâr=' + karPct.toFixed(2) + '%, Trend yukarı, RSI=' + rsi);
        return 'BEKLE';
    }
    
    // 4. AL SİNYALİ: RSI düşük (<35) VE trend yukarı dönüyor
    if (rsi < 35 && macdHist > 0) {
        console.log('🟢 AL sinyali: RSI düşük (' + rsi + '), MACD pozitif');
        return 'AL';
    }
    
    // 5. EKLE SİNYALİ: Fiyat maliyetin altında VE RSI düşük
    if (karPct < -2 && rsi < 40) {
        console.log('🔵 EKLE sinyali: Zararda (' + karPct.toFixed(2) + '%), RSI düşük (' + rsi + ')');
        return 'EKLE';
    }
    
    // 6. Varsayılan: BEKLE
    console.log('⚪ Varsayılan BEKLE: Belirgin sinyal yok');
    return 'BEKLE';
}

    <button id="rw-calc" style="flex:1;padding:10px;border:none;border-radius:8px;background:#22c55e;color:#0b2e13;font-weight:700;cursor:pointer;">Hesapla</button>
  </div>
  <div id="rw-output" style="margin-top:10px;background:rgba(0,0,0,0.25);border-radius:8px;padding:10px;color:#e2e8f0;font-size:13px;"></div>
</div>


<script>
(function(){
  var openBtn = document.getElementById('risk-widget-open');
  var panel = document.getElementById('risk-widget');
  var closeBtn = document.getElementById('risk-widget-close');
  var calcBtn = document.getElementById('rw-calc');
  var autoBtn = document.getElementById('rw-autofill');
  function val(id){ var el = document.getElementById(id); return el && el.value ? parseFloat(el.value) : NaN; }
  function fmt(n){ return isFinite(n) ? (Math.round(n*100)/100).toLocaleString('tr-TR') : '-'; }
  function floorInt(n){ return Math.max(0, Math.floor(n)); }
  function setVal(id, v){ var el = document.getElementById(id); if(el && v!=null && v!=='' && !Number.isNaN(v)) el.value = String(v); }
  function adjTick(x, t){ if(!isFinite(t) || t<=0) return x; return Math.round(x/t)*t; }
  function autoFillFromTicker(){
    try{
      var ticker = (typeof localStorage!=='undefined' && localStorage.getItem('lastSelectedTicker')) ? localStorage.getItem('lastSelectedTicker') : '';
      var signals = (window.allSignalsData && Array.isArray(window.allSignalsData)) ? window.allSignalsData : (typeof signalsData!=='undefined' ? signalsData : []);
      if(!ticker || !signals || !signals.length){
        document.getElementById('rw-output').innerHTML = 'Oto doldur için aktif ticker/sinyal bulunamadı.';
        return;
      }
      var sig = signals.find(function(s){ return (s && (s.ticker||'').toString().toUpperCase()===ticker.toString().toUpperCase()); });
      if(!sig){
        document.getElementById('rw-output').innerHTML = 'Ticker için sinyal bulunamadı: ' + ticker;
        return;
      }
      var price = parseFloat(sig.fiyat || sig.price || 0);
      if(!isFinite(price) || price<=0){
        document.getElementById('rw-output').innerHTML = 'Geçerli fiyat yok; giriş/stop’u manuel girin.';
        return;
      }
      setVal('rw-entry', price.toFixed(2));
      setVal('rw-stop', (price*0.97).toFixed(2));
      var bbU = parseFloat(sig.bb_upper || sig.bbUpper || 0);
      var bbL = parseFloat(sig.bb_lower || sig.bbLower || 0);
      if(isFinite(bbU) && isFinite(bbL) && bbU>bbL){
        var width = bbU - bbL;
        var sigma = width / 4;       // Tipik 2σ Bollinger → genişlik ≈ 4σ
        var atrEst = sigma * 1.5;    // ATR ~ 1.5σ yaklaşık
        if(atrEst>0){
          setVal('rw-atr', atrEst.toFixed(4));
          if(!isFinite(val('rw-atrk')) || val('rw-atrk')<=0) setVal('rw-atrk', 1.8);
        }
        document.getElementById('rw-output').innerHTML = 'Aktif ticker: '+ ticker +' → Giriş/Stop ve ATR (BB genişliğinden) otomatik dolduruldu.';
      } else {
        document.getElementById('rw-output').innerHTML = 'Aktif ticker: '+ ticker +' → Giriş/Stop otomatik dolduruldu. ATR için grafikten değer gir.';
      }
    }catch(e){
      document.getElementById('rw-output').innerHTML = 'Oto doldur hatası: ' + (e && e.message ? e.message : e);
    }
  }
  function compute(){
    var portfolio = val('rw-portfolio');
    var riskPct   = val('rw-riskpct');
    var entry     = val('rw-entry');
    var stop      = val('rw-stop');
    var atr       = val('rw-atr');
    var atrk      = val('rw-atrk');
    var mult      = val('rw-mult');
    var tick      = val('rw-tick');
    if(!isFinite(portfolio) || !isFinite(riskPct) || !isFinite(entry) || !isFinite(stop)){
      document.getElementById('rw-output').innerHTML = 'Eksik veya geçersiz giriş.';
      return;
    }
    var riskAmount = portfolio * (riskPct/100);
    if(!isFinite(mult) || mult<=0) mult = 1;
    var distancePts;
    if(isFinite(atr) && isFinite(atrk) && atr>0 && atrk>0){
      distancePts = atr*atrk;
    } else {
      distancePts = entry - stop;
    }
    if(isFinite(tick) && tick>0) distancePts = adjTick(distancePts, tick);
    var perUnitRisk = distancePts * mult;
    if(perUnitRisk <= 0){
      document.getElementById('rw-output').innerHTML = 'Stop seviyesi hatalı (risk mesafesi ≤ 0).';
      return;
    }
    var qty = floorInt(riskAmount / perUnitRisk);
    var r1 = entry + distancePts;
    var r2 = entry + (2*distancePts);
    var r3 = entry + (3*distancePts);
    if(isFinite(tick) && tick>0){ r1 = adjTick(r1, tick); r2 = adjTick(r2, tick); r3 = adjTick(r3, tick); }
    document.getElementById('rw-output').innerHTML =
      'Risk Tutarı: ' + fmt(riskAmount) + ' | Adet: ' + fmt(qty) +
      '<br>Mesafe (puan): ' + fmt(distancePts) + (isFinite(mult)&&mult>1 ? ' | Mesafe (TL): ' + fmt(distancePts*mult) : '') +
      '<br>1R: ' + fmt(r1) + ' | 2R: ' + fmt(r2) + ' | 3R: ' + fmt(r3);
  }
  if(openBtn){ openBtn.addEventListener('click', function(){ panel.style.display = 'block'; }); }
  if(closeBtn){ closeBtn.addEventListener('click', function(){ panel.style.display = 'none'; }); }
  if(calcBtn){ calcBtn.addEventListener('click', compute); }
  if(autoBtn){ autoBtn.addEventListener('click', autoFillFromTicker); }
})();

// ==================== GLOBAL TOGGLE FONKSİYONU ====================
window.toggleDetailedCard = function(headerEl) {
    // Tıklanan kartın bileşenlerini bul
    const card = headerEl.closest('.card');
    const wrapper = card.querySelector('.detailed-content-wrapper');
    const icon = headerEl.querySelector('.toggle-icon');
    
    // Şu an açık mı?
    const wasOpen = wrapper.classList.contains('active');
    
    // 1. TÜM açık kartları kapat
    document.querySelectorAll('.detailed-content-wrapper.active').forEach(el => {
        // Tıklanan kartı kapatma (aşağıda kontrol edeceğiz)
        if (el !== wrapper) {
            el.classList.remove('active');
            // İkonu düzelt
            const pCard = el.closest('.card');
            if (pCard) {
                const pIcon = pCard.querySelector('.toggle-icon');
                if (pIcon) {
                    pIcon.classList.remove('fa-chevron-up');
                    pIcon.classList.add('fa-chevron-down');
                }
            }
        }
    });
    
    // 2. Tıklanan kartın durumunu değiştir (Toggle)
    if (wasOpen) {
        wrapper.classList.remove('active');
        icon.classList.remove('fa-chevron-up');
        icon.classList.add('fa-chevron-down');
    } else {
        wrapper.classList.add('active');
        icon.classList.remove('fa-chevron-down');
        icon.classList.add('fa-chevron-up');
    }
};

// ==================== YENİ DETAYLI ANALİZ KARTI (DEBUG) ====================
function renderDetailedAnalysis() {
    console.log('🚀 DETAYLI ANALİZ RENDER');
    const container = document.getElementById('detay-analiz-container');
    if (!container) {
        console.error('❌ Container YOK');
        return;
    }
    
    try {
        // Yükleniyor veya boş durum
        if (!signalsData || signalsData.length === 0) {
            console.warn('⚠️ Sinyal verisi BOŞ');
            container.innerHTML = '<div style="text-align: center; color: #94a3b8; grid-column: 1/-1;">Analiz verisi bulunamadı.</div>';
            return;
        }
        
        container.innerHTML = '';
        
        signalsData.forEach(sig => {
            // Backend'den gelen yeni analiz metni
            const text = (sig.computed && sig.computed.detailed_analysis) ? sig.computed.detailed_analysis : '';
            
            if (!text) return;

            // Formasyon Verisi
            const patternData = sig.computed || {};
            const patternName = (patternData.pattern && patternData.pattern !== '-' && patternData.pattern !== 'YOK') ? patternData.pattern : null;
            const patternConf = patternData.confidence || '-';
            const patternMean = patternData.meaning || '-';
            
            let patternColor = '#64748b'; // Gri
            if (patternName) {
                const confVal = parseInt(patternConf);
                if (confVal >= 70) patternColor = '#10b981'; // Yeşil
                else if (confVal >= 40) patternColor = '#f59e0b'; // Turuncu
                else patternColor = '#ef4444'; // Kırmızı
            }

            // Kart Oluştur
            const card = document.createElement('div');
            card.className = 'card';
            card.style.cssText = `
                background: rgba(30, 41, 59, 0.6); 
                backdrop-filter: blur(10px);

            card.onmouseover = () => {

            card.onmouseout = () => {

            };

            // HTML İçeriği
            const headerHtml = `
                <div class="detailed-header" onclick="toggleDetailedCard(this)" style="cursor: pointer;">

                            <span style="color: #94a3b8; font-size: 12px; margin-left: 10px;">${sig.computed ? sig.computed.lastUpdate : ''}</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                             <!-- Sinyal Badge -->
                            <span class="signal-badge ${sig.sinyal.toLowerCase()}" style="padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${sig.sinyal}</span>
                            <i class="fas fa-chevron-down toggle-icon" style="color: #94a3b8; transition: transform 0.3s;"></i>
                        </div>
                    </div>
                    
                    <!-- ÖZET BİLGİLER (KAPALIYKEN GÖRÜNEN KISIM) -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05);">
                        <div style="background: rgba(255,255,255,0.03); padding: 6px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 9px; color: #94a3b8; text-transform: uppercase;">ZAMANLAMA</div>
                            <div style="font-size: 11px; font-weight: 700; color: #cbd5e1;">${text.includes('ZAMANLAMA: GÜÇLÜ') ? '<span style="color:#10b981">GÜÇLÜ</span>' : (text.includes('ZAMANLAMA: ZAYIF') ? '<span style="color:#ef4444">ZAYIF</span>' : '<span style="color:#f59e0b">ORTA</span>')}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.03); padding: 6px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 9px; color: #94a3b8; text-transform: uppercase;">MAKRO</div>
                            <div style="font-size: 11px; font-weight: 700; color: #cbd5e1;">${text.includes('MAKRO DURUM: DESTEKLİYOR') ? '<span style="color:#10b981">POZİTİF</span>' : (text.includes('MAKRO DURUM: KARŞI') ? '<span style="color:#ef4444">NEGATİF</span>' : '<span style="color:#f59e0b">NÖTR</span>')}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.03); padding: 6px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 9px; color: #94a3b8; text-transform: uppercase;">RİSK</div>
                            <div style="font-size: 11px; font-weight: 700; color: #cbd5e1;">${text.includes('RİSK SEVİYESİ: DÜŞÜK') ? '<span style="color:#10b981">DÜŞÜK</span>' : (text.includes('RİSK SEVİYESİ: YÜKSEK') ? '<span style="color:#ef4444">YÜKSEK</span>' : '<span style="color:#f59e0b">ORTA</span>')}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.03); padding: 6px; border-radius: 6px; text-align: center;">
                            <div style="font-size: 9px; color: #94a3b8; text-transform: uppercase;">FORMASYON</div>
                            <div style="font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ${patternColor};" title="${patternName || 'Yok'}">${patternName || '-'}</div>
                        </div>
                    </div>
                </div>
            `;

            // ✅ GÜVENLİ FORMATLAMA: <br> etiketlerini koru ve temizle
            // Backend'den gelen metin düz metin olabilir veya <br> içerebilir.
            let formattedText = text;
            
            // Eğer metinde hiç HTML tag yoksa (düz metinse), satır sonlarını <br> yap
            if (!text.includes('<div') && !text.includes('<br')) {
                formattedText = text.replace(/\n/g, '<br>');
            }

            // Önceki metadata satırlarını (ZAMANLAMA:..., MAKRO DURUM:...) temizle
            // Çünkü bunları zaten yukarıda özet kutucuklara koyduk.
            formattedText = formattedText.replace(/^.*\|.*\|.*<br>/, ''); // İlk satır (Ticker | Tarih)
            formattedText = formattedText.replace(/.*ZAMANLAMA:.*<br>/g, '');
            formattedText = formattedText.replace(/.*MAKRO DURUM:.*<br>/g, '');
            formattedText = formattedText.replace(/.*RİSK SEVİYESİ:.*<br>/g, '');
            formattedText = formattedText.replace(/.*FORMASYON:.*<br>/g, '');
            
            // Başlıkları (Büyük harfli kısımlar) vurgula
            formattedText = formattedText.replace(/(NEDENLER:|UYARILAR:|STRATEJİ:|GİRİŞ:|STOP:|HEDEF \d:)/g, '<strong style="color: #fff; display:block; margin-top:12px; margin-bottom:6px; font-size:14px;">$1</strong>');
            
            // Tire ile başlayan maddeleri düzenle
            formattedText = formattedText.replace(/<br>\s*-\s*/g, '<br>• ');

            const contentHtml = `
                <div class="detailed-content-wrapper" style="display: none; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <!-- Ana Analiz Metni -->
                    <div class="detailed-content" style="font-size: 13px; line-height: 1.6; color: #e2e8f0; margin-bottom: 20px;">
                        ${formattedText}
                    </div>

                    <!-- MUM FORMASYONU KARTI -->
                    <div class="modal-section formasyon" style="background: rgba(0,0,0,0.2); border-radius: 8px; padding: 10px; border: 1px solid ${patternColor}40; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                        
                        <!-- Sol Taraf: İkon ve Başlık -->
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 16px;">🕯️</span>
                            <div>
                                <div style="font-size: 11px; color: #94a3b8; font-weight: 600;">MUM FORMASYONU</div>
                                ${patternName ? 
                                    `<div style="font-size: 12px; font-weight: 700; color: ${patternColor};">${patternName} <span style="font-size: 10px; opacity: 0.8;">(%${patternConf})</span></div>` 
                                    : '<div style="font-size: 11px; color: #64748b;">Tespit Edilemedi</div>'}
                            </div>
                        </div>

                        <!-- Sağ Taraf: Detay veya Buton -->
                        <div style="flex: 1; text-align: right;">
                            ${patternName ? `
                                <div style="font-size: 11px; color: #cbd5e1; line-height: 1.3; text-align: right;">
                                    ${patternMean}
                                </div>
                            ` : `
                                <button onclick="runCandleAnalysis('${sig.ticker}')" class="action-btn" style="background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; padding: 4px 10px; border-radius: 4px; color: white; cursor: pointer; font-size: 11px; transition: opacity 0.2s;">
                                    <i class="fas fa-magic"></i> Analiz Et
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;

            card.innerHTML = headerHtml + contentHtml;
            container.appendChild(card);
        });

    } catch (e) {
        console.error('❌ Render Hatası:', e);
        container.innerHTML = `<div style="text-align: center; color: #f87171; grid-column: 1/-1;">Render Hatası: ${e.message}</div>`;
    }
}
</script>

<script>
// ========================================
// PERFORMANS SEKMESI FONKSIYONLARI
// ========================================

/**
 * Performans hesaplama ana fonksiyonu
 */
function calculatePerformance() {
    console.log('📊 Performans hesaplanıyor...');
    
    // Tarih değerlerini al
    const startDateInput = document.getElementById('performans-start-date').value;
    const endDateInput = document.getElementById('performans-end-date').value;
    
    if (!startDateInput || !endDateInput) {
        alert('⚠️ Lütfen başlangıç ve bitiş tarihlerini seçin!');
        return;
    }
    
    // Tarihleri GFs formatına çevir (DD.MM.YYYY)
    const startDate = formatDateForGFs(startDateInput);
    const endDate = formatDateForGFs(endDateInput);
    
    console.log('📅 Seçilen tarihler:', { start: startDate, end: endDate });
    
    // GFs verisinden ilgili satırları bul
    const startRow = findGFsRowByDate(startDate);
    const endRow = findGFsRowByDate(endDate);
    
    if (!startRow || !endRow) {
        alert('❌ Seçilen tarihler için veri bulunamadı!\n\nLütfen GFs sayfasında bu tarihlerin mevcut olduğundan emin olun.');
        console.error('Veri bulunamadı:', { startRow, endRow, startDate, endDate });
        return;
    }
    
    console.log('✅ Veriler bulundu:', { startRow, endRow });
    
    // Her bir kalem için performans hesapla
    const performanceData = {
        toplamBudget: calculateItemPerformance(startRow[20], endRow[20], 'TOPLAM BÜTÇE', '₺'),
        sahsiViop: calculateItemPerformance(startRow[12], endRow[12], 'ŞAHSİ VİOP', '₺'),
        sirketViop: calculateItemPerformance(startRow[14], endRow[14], 'VİOP ŞİRKET', '₺'),
        sahsiHisse: calculateItemPerformance(startRow[16], endRow[16], 'ŞAHSİ HİSSELER', '₺'),
        sirketHisse: calculateItemPerformance(startRow[18], endRow[18], 'ŞİRKET HİSSELER', '₺'),
        aft: calculateItemPerformance(startRow[4], endRow[4], 'AFT (Fon)', '₺'),
        ivy: calculateItemPerformance(startRow[22], endRow[22], 'IVY (Fon)', '₺')
    };
    
    console.log('📊 Hesaplanan performans:', performanceData);
    
    // Sonuçları render et
    renderPerformanceResults(performanceData);
}

/**
 * ISO tarih formatını GFs formatına çevirir (2026-05-06 -> 06.05.2026)
 */
function formatDateForGFs(isoDate) {
    const parts = isoDate.split('-');
    return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

/**
 * GFs verisinde belirli bir tarihe ait satırı bulur
 */
function findGFsRowByDate(date) {
    if (!window.gfsData) {
        console.error('❌ gfsData bulunamadı!');
        return null;
    }
    
    for (let i = 1; i < gfsData.length; i++) {
        if (gfsData[i][1] === date) {
            return gfsData[i];
        }
    }
    
    return null;
}

/**
 * Bir kalem için performans hesaplar
 */
function calculateItemPerformance(startValue, endValue, label, currency) {
    const start = parseNumberSmart(startValue) || 0;
    const end = parseNumberSmart(endValue) || 0;
    const diff = end - start;
    const percent = start > 0 ? (diff / start) * 100 : 0;
    
    return {
        label: label,
        currency: currency,
        start: start,
        end: end,
        diff: diff,
        percent: percent
    };
}

/**
 * Performans sonuçlarını ekrana render eder
 */
function renderPerformanceResults(data) {
    // Özet kartı göster
    const ozetCard = document.getElementById('performans-ozet-card');
    ozetCard.style.display = 'block';
    
    // Toplam bütçe özeti
    const toplamBudget = data.toplamBudget;
    document.getElementById('performans-ozet-start').textContent = 
        toplamBudget.currency + formatNumber(Math.round(toplamBudget.start));
    document.getElementById('performans-ozet-end').textContent = 
        toplamBudget.currency + formatNumber(Math.round(toplamBudget.end));
    
    const diffColor = toplamBudget.diff >= 0 ? '#22c55e' : '#ef4444';
    const diffSign = toplamBudget.diff >= 0 ? '+' : '';
    
    const diffElement = document.getElementById('performans-ozet-diff');
    diffElement.textContent = diffSign + toplamBudget.currency + formatNumber(Math.round(Math.abs(toplamBudget.diff)));
    diffElement.style.color = diffColor;
    
    const percentElement = document.getElementById('performans-ozet-percent');
    percentElement.textContent = diffSign + toplamBudget.percent.toFixed(2) + '%';
    percentElement.style.color = diffColor;
    
    // Detaylı tabloyu göster
    const tableContainer = document.getElementById('performans-table-container');
    tableContainer.style.display = 'block';
    
    // Tablo içeriğini oluştur
    const tbody = document.getElementById('performans-table-body');
    tbody.innerHTML = '';
    
    Object.values(data).forEach(item => {

/**
 * Sayı formatlama fonksiyonu (parseNumberSmart'ın alternatifi)
 */
function parseNumberSmart(value) {
    if (!value || value === '-' || value === '') return 0;

    let str = String(value).trim();
    // Para birimi sembollerini kaldır
    str = str.replace(/[₺$€£]/g, '').trim();

    // STANDART TÜRK FORMATI (SABİT KURAL — TAHMİN YOK): bu sheet'teki TÜM sayısal hücreler
    // Türkçe yerel ayara göre biçimleniyor — NOKTA HER ZAMAN binlik ayıracı, VİRGÜL HER ZAMAN
    // ondalık ayıracıdır (bkz. .gs tarafındaki "STANDART TÜRK FORMATI PARSE" yorumlarıyla aynı kural).
    // ESKİ HATA: önceki sürüm "tek nokta mı çift nokta mı" diye SAYARAK karar veriyordu — bu yüzden
    // "350.000" gibi TEK noktalı ve tam 3 sıfırla biten binlik değerleri (350.000 TL = 350000)
    // yanlışlıkla ondalık sanıp 350'ye indiriyordu (350.000 → parseFloat → 350). Artık nokta
    // SAYISINA bakılmaksızın HER ZAMAN siliniyor, virgül HER ZAMAN ondalık noktasına çevriliyor —
    // belirsizlik tamamen ortadan kalkıyor.
    str = str.replace(/\./g, '').replace(',', '.');

    return parseFloat(str) || 0;
}

    const deger = (v, r) => `<span style="display:grid;grid-template-columns:auto 1fr;color:${r};font-weight:600;"><span>${isaret(v)}</span><span style="text-align:right;">${sayi(v)}</span></span>`;
    let html = `
        <div style="text-align:left;width:100%;display:grid;grid-template-columns:1fr auto;align-items:baseline;font-size:12px;font-weight:700;color:#cbd5e1;text-transform:uppercase;padding-bottom:3px;border-bottom:1px solid rgba(255,255,255,0.12);font-variant-numeric:tabular-nums;">
            <span>${baslik}</span><span style="font-size:17px;color:${renk(toplamPct)};">${isaret(toplamPct)}${sayi(toplamPct)}</span>
        </div>`;
    if (cekim > 0) {
        html += `
        <div style="${altSatir}"><span>İşlem Karı</span>${deger(islemPct, renk(islemPct))}</div>
        <div style="${altSatir}"><span>Nakit Çıkış</span>${deger(nakitPct, '#fbbf24')}<span style="font-size:9px;">(${Math.round(cekim).toLocaleString('tr-TR')} TL)</span></div>`;
    }
    return html;
}
