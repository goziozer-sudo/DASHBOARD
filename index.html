<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nakit Çıkış Butonu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: #fff;
    min-height: 100vh;
    padding: 10px;
}

.container {
    max-width: 1920px;
    margin: 0 auto;
    padding: 0 15px;
}

/* Header */
header {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 0;
    padding: 20px 30px;
    margin: 0 0 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

header h1 {
    font-size: 28px;
    font-weight: 600;
}

header h1 i {
    margin-right: 10px;
    color: #4ade80;
}

.header-controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.btn-refresh {
    background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
    border: none;
    color: white;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    width: 38px;
    height: 38px;
}

.btn-refresh:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(74, 222, 128, 0.4);
}

.btn-refresh:active {
    transform: translateY(0);
}

.btn-refresh i {
    transition: transform 0.6s ease;
}

.btn-refresh.loading i {
    animation: spin 1s linear infinite;
}

/* Refresh Interval Dropdown */
@keyframes spin {
    100% { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
}

@keyframes mofcom-pulse {
    0%, 100% { 
        box-shadow: 0 0 0 0 rgba(250, 248, 132, 0.4);
    }
    50% { 
        box-shadow: 0 0 20px 5px rgba(250, 248, 132, 0.6);
    }
}

.last-update {
    font-size: 13px;
    color: #cbd5e1;
}

/* Live Data Boxes */

/* Tabs */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.tab-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid transparent;
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s ease;
}

@media (max-width: 768px) {
    .tab-btn {
        padding: 8px 12px;
        font-size: 13px;
        flex: 1;
        min-width: 80px;
    }
}

.tab-btn:hover {
    background: rgba(255, 255, 255, 0.15);
}

.tab-btn.active {
    background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
    border-color: #a78bfa;
    box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
}

/* Tab Content */
.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Cards Container - Desktop */
.cards-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 280px));
    gap: 15px;
    margin-bottom: 30px;
    justify-content: start; /* Kartları sola yasla, boşlukları kaldır */
}

/* Tablet (768px altı): 2 sütun, daha esnek */
@media (max-width: 768px) {
    .cards-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
}

/* Mobil (480px altı): 1 sütun, tam genişlik */
@media (max-width: 480px) {
    .cards-container {
        grid-template-columns: 1fr;
        gap: 10px;
    }
}

.card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: stretch; /* İçeriği tam genişlikte tut */
    gap: 0;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.2);
    min-height: 140px; /* DİNAMİK - içeriğe göre büyür */
    width: 100%;
}

/* Card Header: İkon + Başlık ortada */

/* ÖZET Sekmesi - İkon ve başlık ortada, içerik ortada */
#ozet-tab .card {

}

#ozet-tab .card-icon {

}

#ozet-tab .card-content {

}

#ozet-tab .card-content h3 {

    color: white;
}

/* Pozisyon Performansı Kartı - Yeni Stil */
/* Günlük Değişim Kartları - Ortala */
.card-content h3,
.card-content p {
    text-align: center;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    border-color: rgba(255, 255, 255, 0.3);
}

/* NAKİT Kartları Hover Efekti */
.nakit-editable-card {
    cursor: pointer;
    position: relative;
    transition: all 0.3s ease;
}

.nakit-editable-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 15px 35px rgba(250, 248, 132, 0.3);
    border-color: #FAF884;
}

.card-icon {
    font-size: 20px;
    color: #4ade80;
    min-width: 20px;
    text-align: center;
    flex-shrink: 0;
}

.card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-align: center;
    width: 100%;
    padding: 0;
}

.card-content h3 {
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 10px;
    margin-top: 0;
    font-weight: 500;
    text-align: center;
    width: 100%;
    text-transform: uppercase;
}

.card-content p {
    width: 100%;
    text-align: center;
    margin: 0;
}

/* Stacked Coins Icon */
.stacked-coins {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 40px;
}

.stacked-coins i {
    position: absolute;
    font-size: 28px;
}

.stacked-coins i:nth-child(1) {
    top: 0;
    left: 5px;
    opacity: 0.6;
    color: #FAF884;
}

.stacked-coins i:nth-child(2) {
    top: 8px;
    left: 10px;
    opacity: 0.8;
    color: #f59e0b;
}

.stacked-coins i:nth-child(3) {
    top: 16px;
    left: 15px;
    opacity: 1;
    color: #FAF884;
}

.card-content p {
    font-size: 22px;
    font-weight: 700;
}

/* Teminat Oranı Kartı */
.teminat-card {
    position: relative;
    overflow: hidden;
}

.teminat-card .card-content {
    width: 100%;
}

.teminat-percentage {
    font-size: 24px;
    font-weight: 500;
    margin: 0 0 8px 0;
    line-height: 1.4;
}

.teminat-bar-container {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    overflow: hidden;
    margin: 8px 0;
}

.teminat-bar {
    height: 100%;
    border-radius: 10px;
    transition: width 0.5s ease, background 0.3s ease;
}

.teminat-status {
    font-size: 14px;
    font-weight: 400;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Teminat Renk Kodları */
.teminat-safe {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
}

.teminat-safe .card-icon {
    color: #22c55e;
}

.teminat-safe .teminat-bar {
    background: linear-gradient(90deg, #22c55e 0%, #4ade80 100%);
}

.teminat-safe .teminat-percentage {
    color: white;
}

.teminat-safe .teminat-status {
    color: #22c55e;
}

.teminat-warning {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
}

.teminat-warning .card-icon {
    color: #FAF884;
}

.teminat-warning .teminat-bar {
    background: linear-gradient(90deg, #FAF884 0%, #FAF884 100%);
}

.teminat-warning .teminat-percentage {
    color: white;
}

.teminat-warning .teminat-status {
    color: #FAF884;
}

.teminat-danger {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
}

.teminat-danger .card-icon {
    color: #ef4444;
}

.teminat-danger .teminat-bar {
    background: linear-gradient(90deg, #ef4444 0%, #f87171 100%);
}

.teminat-danger .teminat-percentage {
    color: white;
}

.teminat-danger .teminat-status {
    color: #ef4444;
}

/* Risk Raporu Kartı */
.risk-card {
    position: relative;
}

.risk-value {
    font-size: 18px;
    font-weight: 700;
    margin: 5px 0;
    line-height: 1.4;
}

.risk-ratio {
    font-size: 24px;
    font-weight: 800;
    margin: 10px 0 5px 0;
}

.risk-status {
    font-size: 12px;
    font-weight: 600;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Risk Renk Kodları - Teminat ile aynı sınıfları kullan */
.risk-card.teminat-safe .risk-ratio,
.risk-card.teminat-safe .risk-status {
    color: #4ade80;
}

.risk-card.teminat-warning .risk-ratio,
.risk-card.teminat-warning .risk-status {
    color: #FAF884;
}

.risk-card.teminat-danger .risk-ratio,
.risk-card.teminat-danger .risk-status {
    color: #f87171;
}

/* Teminat & Risk Combined Card */
.teminat-risk-combined-card {
    position: relative;
    overflow: hidden;
    /* min-height ve max-height kaldırıldı - genel .card kuralı geçerli olacak (190px) */
    padding: 18px !important; /* 15px → 18px (diğer kartlarla aynı) */
}

.teminat-risk-combined-card .card-content {
    width: 100%;
    padding: 0;
    display: flex;
    flex-direction: column;
    /* height: 100% kaldırıldı - min-height kullanılacak */
    /* justify-content: space-between kaldırıldı - içerik center olacak */
}

/* Safe Status - Yeşil (Başlık hariç tüm yazılar) */
.teminat-risk-combined-card.teminat-safe {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.2);
}

/* İkonlar yeşil */

.teminat-risk-combined-card.teminat-safe #viop-sahsi-risk-icon,
.teminat-risk-combined-card.teminat-safe #viop-sirket-teminat-icon,
.teminat-risk-combined-card.teminat-safe #viop-sirket-risk-icon {

}

/* Label yazılar yeşil */

}

/* Durum yazısı yeşil */

.teminat-risk-combined-card.teminat-safe #viop-sirket-teminat-risk-status {
    color: #4ade80;
}

/* Başlık gri kalır (değişmez) */
.teminat-risk-combined-card.teminat-safe h3 {
    color: #cbd5e1;
}

/* Warning Status - Sarı */
.teminat-risk-combined-card.teminat-warning #viop-sahsi-teminat-icon,
.teminat-risk-combined-card.teminat-warning #viop-sahsi-teminat-percentage,
.teminat-risk-combined-card.teminat-warning #viop-sahsi-teminat-check,
.teminat-risk-combined-card.teminat-warning #viop-sahsi-risk-icon,
.teminat-risk-combined-card.teminat-warning #viop-sahsi-risk-ratio,
.teminat-risk-combined-card.teminat-warning #viop-sahsi-risk-check,
.teminat-risk-combined-card.teminat-warning #viop-sirket-teminat-icon,
.teminat-risk-combined-card.teminat-warning #viop-sirket-teminat-percentage,
.teminat-risk-combined-card.teminat-warning #viop-sirket-teminat-check,
.teminat-risk-combined-card.teminat-warning #viop-sirket-risk-icon,
.teminat-risk-combined-card.teminat-warning #viop-sirket-risk-ratio,
.teminat-risk-combined-card.teminat-warning #viop-sirket-risk-check {
    color: #FAF884;
}

/* Danger Status - Kırmızı */
.teminat-risk-combined-card.teminat-danger #viop-sahsi-teminat-icon,
.teminat-risk-combined-card.teminat-danger #viop-sahsi-teminat-percentage,
.teminat-risk-combined-card.teminat-danger #viop-sahsi-teminat-check,
.teminat-risk-combined-card.teminat-danger #viop-sahsi-risk-icon,
.teminat-risk-combined-card.teminat-danger #viop-sahsi-risk-ratio,
.teminat-risk-combined-card.teminat-danger #viop-sahsi-risk-check,
.teminat-risk-combined-card.teminat-danger #viop-sirket-teminat-icon,
.teminat-risk-combined-card.teminat-danger #viop-sirket-teminat-percentage,
.teminat-risk-combined-card.teminat-danger #viop-sirket-teminat-check,
.teminat-risk-combined-card.teminat-danger #viop-sirket-risk-icon,
.teminat-risk-combined-card.teminat-danger #viop-sirket-risk-ratio,
.teminat-risk-combined-card.teminat-danger #viop-sirket-risk-check {
    color: #f87171;
}

/* Tables */
.table-container {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 20px;
    overflow-x: auto;
    margin-bottom: 20px;
}

.table-container h3 {
    margin-bottom: 15px;
    color: #4ade80;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

thead {
    background: rgba(139, 92, 246, 0.3);
}

th {
    padding: 10px 8px;
    text-align: center;
    font-weight: 600;
    font-size: 13px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    white-space: nowrap;
    text-transform: uppercase;
}

td {
    padding: 10px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 13px;
    text-align: center;
}

tbody tr {
    transition: background 0.2s ease;
}

tbody tr:hover {
    background: rgba(255, 255, 255, 0.05);
}

.positive {
    color: #4ade80;
    font-weight: 600;
}

.negative {
    color: #f87171;
    font-weight: 600;
}

/* Budget Tables Layout */
.budget-tables {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    width: fit-content !important;  /* ŞİRKET KONTRATLAR ile aynı */
    max-width: 100%;
    margin-left: 0;
}

/* Budget Tables - KONTRATLAR ile eşitlendi */
#budget-tab .table-container table th {
    font-size: 13px;
    padding: 10px 8px;
}

#budget-tab .table-container table td {
    font-size: 13px;
    padding: 10px 8px;
    font-weight: 500;
}

#budget-tab .table-container h3 {
    font-size: 16px;
    margin-bottom: 15px;
}

/* HESAPLAR tablosu - 1. sütun (Hesap) sola yasla */
#budget-accounts-table th:nth-child(1),
#budget-accounts-table td:nth-child(1) {
    text-align: left;
}

/* Loading */
.loading {
    text-align: center;
    padding: 60px 20px;
}

.spinner {
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top: 4px solid #4ade80;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

/* Error Message */
.error-message {
    background: rgba(248, 113, 113, 0.2);
    border: 2px solid #f87171;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    color: #fecaca;
}

/* Responsive */
@media (max-width: 768px) {
    header {
        flex-direction: column;
        align-items: flex-start;
    }

    header h1 {
        font-size: 22px;
    }
    
    .header-controls {
        width: 100%;
        justify-content: space-between;
    }
    
    .btn-refresh {
        font-size: 14px;
        padding: 10px 14px;
        min-height: 44px;
    }

    .budget-tables {
        grid-template-columns: 1fr;
    }

    .table-container {
        padding: 15px;
    }

    table {
        font-size: 12px;
    }

    th, td {
        padding: 8px;
    }
}

/* ========================================
   VİOP TABLO KOLON GİZLEME (05.01.2026)
   ========================================
   Gizlenen kolonlar:
   - Alış Tarihi (2. kolon)
   - Kontrat % (5. kolon)
   - Başlangıç Teminat (6. kolon)
   - Hisse Adedi (7. kolon)
   - Toplam Tutar (9. kolon)
   - Güncel Teminat (10. kolon)
   - Kaldıraç Oranı (14. kolon)
   - Vade Tarihi (16. kolon)
   ======================================== */

/* Alış Tarihi (2. kolon) */
#viop-sirket-table th:nth-child(2),
#viop-sirket-table td:nth-child(2),
#viop-sahsi-table th:nth-child(2),
#viop-sahsi-table td:nth-child(2) {
    display: none;
}

/* Kontrat % (5. kolon) */
#viop-sirket-table th:nth-child(5),
#viop-sirket-table td:nth-child(5),
#viop-sahsi-table th:nth-child(5),
#viop-sahsi-table td:nth-child(5) {
    display: none;
}

/* Başlangıç Teminat (6. kolon) */
#viop-sirket-table th:nth-child(6),
#viop-sirket-table td:nth-child(6),
#viop-sahsi-table th:nth-child(6),
#viop-sahsi-table td:nth-child(6) {
    display: none;
}

/* Hisse Adedi (7. kolon) */
#viop-sirket-table th:nth-child(7),
#viop-sirket-table td:nth-child(7),
#viop-sahsi-table th:nth-child(7),
#viop-sahsi-table td:nth-child(7) {
    display: none;
}

/* Toplam Tutar (9. kolon) */
#viop-sirket-table th:nth-child(9),
#viop-sirket-table td:nth-child(9),
#viop-sahsi-table th:nth-child(9),
#viop-sahsi-table td:nth-child(9) {
    display: none;
}

/* Güncel Teminat (10. kolon) */
#viop-sirket-table th:nth-child(10),
#viop-sirket-table td:nth-child(10),

    // genişliği kadar (-33.33%) kaydırıp başa sarıyor — izleyici hiç "sıfırlanma" anı görmüyor.
    // Süre, içerik uzunluğuna göre JS'de hesaplanıyor (çok haber varsa animasyon da uzuyor,
    // böylece okuma hızı her zaman sabit kalıyor). Üstüne gelince durması (:hover) zaten CSS'te
    // tanımlıydı, bu da artık gerçekten işliyor.
    const tekKopyaHtml = tickerNews.map((news, i) => {
        const isCritical = news.keywords && news.keywords.includes('critical');
        const icon = isCritical ? '🔴' : '🟡';
        const shortTitle = news.title.length > 110 ? news.title.substring(0, 110) + '...' : news.title;
        return '<span class="news-ticker-item ' + (isCritical ? 'critical' : 'normal') + '" onclick="openNewsDetailFromTicker(' + i + ')" style="cursor:pointer;">' + icon + ' ' + shortTitle + '</span><span class="news-ticker-separator">•</span>';
    }).join('');

    // (30.10.2026 eklendi) Gökhan'ın isteğiyle: haber sayısı AZSA (örn. 3 haber), tek bir "tur" (tekKopyaHtml)
    // ekranı doldurmaya yetmiyordu — bu da haberler bitince kayma hissi kesilip "boşluğa düşüp" sıfırlanıyormuş
    // gibi görünüyordu, gerçek bir dairesel/kesintisiz kayma hissi vermiyordu. ÇÖZÜM: önce TEK bir turun doğal
    // genişliğini ölç, konteynerin (görünen alanın) genişliğinden DAHA DAR ise, haber listesini yeterli sayıda
    // art arda tekrarlayıp "tek tur" olarak ekranı (en az bir konteyner genişliği kadar) dolduracak hale getir —
    // ancak SONRA bu büyütülmüş turu yine 3 kere art arda basıp (mevcut kesintisiz-döngü tekniği) kaydırıyoruz.
    // Sonuç: haber sayısı ne olursa olsun, bir haber sol kenardan kaybolurken ekranda HER ZAMAN yeterince içerik
    // (gerekirse aynı haberlerin tekrarı) akmaya devam ediyor — "duruyor" hissi tamamen ortadan kalkıyor.
    ticker.style.animation = 'none';
    ticker.innerHTML = tekKopyaHtml;
    void ticker.offsetWidth;
    const tekTurDogalGenisligi = Math.max(1, ticker.scrollWidth);
    const konteynerGenisligi = container.clientWidth || container.offsetWidth || 0;
    const tekrarSayisi = Math.max(1, Math.ceil((konteynerGenisligi + 1) / tekTurDogalGenisligi));
    const buyutulmusKopyaHtml = tekKopyaHtml.repeat(tekrarSayisi);

    ticker.innerHTML = buyutulmusKopyaHtml + buyutulmusKopyaHtml + buyutulmusKopyaHtml;
    void ticker.offsetWidth; // reflow — animasyonu baştan temiz başlatmak için
    const birKopyaGenisligi = ticker.scrollWidth / 3;
    const HIZ_PX_SANIYE = tickerHizPxSaniyeGetir(); // (30.10.2026 güncellendi) artık sabit değil — Gökhan ⚙️ ile Yavaş/Orta/Hızlı seçebiliyor (bkz. tickerHizPxSaniyeGetir)
    const sureSaniye = Math.max(8, Math.round(birKopyaGenisligi / HIZ_PX_SANIYE));
    ticker.style.animation = 'ticker ' + sureSaniye + 's linear infinite';
}

let currentAnadoluRow = null;

function openAnadoluHayatModal(row) {
    currentAnadoluRow = row;
    const modal = document.getElementById('anadolu-hayat-modal');
    const input = document.getElementById('anadolu-tl-input');
    
    // Mevcut TL değerini göster
    if (row[1]) {
        const currentValue = parseNumberSmart(row[1]);
        if (!isNaN(currentValue) && currentValue > 0) {
            input.value = currentValue;
        }
    }
    
    modal.style.display = 'flex';
    setTimeout(() => input.focus(), 100);
}

function closeAnadoluHayatModal() {
    const modal = document.getElementById('anadolu-hayat-modal');
    modal.style.display = 'none';
    document.getElementById('anadolu-tl-input').value = '';
    currentAnadoluRow = null;
}

async function saveAnadoluHayat() {
    const input = document.getElementById('anadolu-tl-input');
    const value = input.value.trim();
    
    if (!value) {
        alert('Lütfen bir değer girin!');
        return;
    }
    
    // Türk sayı formatını temizle (örn: 562.000 → 562000)
    const cleanValue = value.replace(/\./g, '').replace(',', '.');
    const numValue = parseFloat(cleanValue) || 0;
    if (isNaN(numValue) || numValue < 0) {
        alert('Geçerli bir sayı girin!');
        return;
    }
    
    // Google Sheets'e yaz
    // BUDGET sayfasında ANADOLU HAYAT satırını bul ve B sütununa yaz
    try {
        // Apps Script URL (global değişken kullan)
        
        console.log('📤 ANADOLU HAYAT kaydediliyor:', numValue);
        
        const response = await fetch(`${APPS_SCRIPT_URL}?action=updateAnadoluHayat&value=${numValue}`, {
            method: 'GET'
        });
        
        const result = await response.json();
        
        console.log('📥 Sunucu yanıtı:', result);
        
        if (result.status === 'success') {
            alert('✅ ANADOLU HAYAT EMEKLİLİK değeri güncellendi!\n\nYeni değer: ₺' + formatNumber(numValue));
            closeAnadoluHayatModal();
            
            // Verileri yeniden yükle
            setTimeout(() => {
                loadAllData();
            }, 1000);
        } else {
            alert('❌ Hata: ' + result.message);
        }
        
    } catch (error) {
        console.error('Kaydetme hatası:', error);
        alert('❌ Kaydetme hatası: ' + error.message);
    }
}

// Enter tuşu ile kaydet
document.addEventListener('keydown', (e) => {
    const anadoluModal = document.getElementById('anadolu-hayat-modal');
    const viopSirketNakitModal = document.getElementById('viop-sirket-nakit-modal');
    
    // ANADOLU HAYAT
    if (anadoluModal.style.display === 'flex' && e.key === 'Enter') {
        saveAnadoluHayat();
    } else if (anadoluModal.style.display === 'flex' && e.key === 'Escape') {
        closeAnadoluHayatModal();
    }
    
    // VİOP ŞİRKET NAKİT
    if (viopSirketNakitModal.style.display === 'flex' && e.key === 'Enter') {
        saveViopSirketNakit();
    } else if (viopSirketNakitModal.style.display === 'flex' && e.key === 'Escape') {
        closeViopSirketNakitModal();
    }
});

function openViopSirketNakitModal() {
    const modal = document.getElementById('viop-sirket-nakit-modal');
    const input = document.getElementById('viop-sirket-nakit-input');
    input.value = '';
    document.getElementById('sirket-hesap-sonuc').style.display = 'none';

    // Mevcut toplam ve nakit değerlerini al
    // ÖNCEDEN: "Toplam Hesap" kutusunun DOM'daki (formatlanmış) metni, hep Türkçe format
    // (nokta=binlik, virgül=ondalık) varsayılarak tekrar parse ediliyordu. Ancak bu kutu, kontrat
    // para birimine göre $ (ABD formatı: virgül=binlik) ile de gösterilebiliyor — bu durumda
    // yanlış parse (ör. $5,414,114 → 5.414) oluşuyordu. Artık renderViopByAccount() içinde zaten
    // doğru parse edilmiş HAM sayı (window.viopSirketToplamHesapRaw) kullanılıyor; DOM metni sadece
    // o global hiç set edilmemişse (beklenmeyen durum) yedek olarak kullanılıyor.
    const toplamEl = document.getElementById('viop-sirket-toplam-hesap');
    const nakitEl = document.getElementById('viop-sirket-portfoy-nakit');

    const rawOk = typeof window.viopSirketToplamHesapRaw === 'number' && !isNaN(window.viopSirketToplamHesapRaw);
    window._sirketToplamHesap = rawOk
        ? window.viopSirketToplamHesapRaw
        : (toplamEl ? parseAmountAnyFormat(toplamEl.textContent) : 0);
    window._sirketMevcutNakit = nakitEl ? parseAmountAnyFormat(nakitEl.textContent) : 0;

    console.log('🔍 ŞİRKET Nakit Modal açılıyor:', {
        kaynak: rawOk ? 'HAM global (viopSirketToplamHesapRaw)' : 'DOM metni (yedek yol)',
        toplamHesapDOMMetni: toplamEl ? toplamEl.textContent : null,
        hesaplananToplamHesap: window._sirketToplamHesap,
        mevcutNakit: window._sirketMevcutNakit
    });

    const fmt = v => '₺' + Math.round(v).toLocaleString('tr-TR');
    document.getElementById('sirket-popup-mevcut-toplam').textContent = fmt(window._sirketToplamHesap);
    document.getElementById('sirket-popup-mevcut-nakit').textContent = fmt(window._sirketMevcutNakit);

    modal.style.display = 'flex';
    setTimeout(() => input.focus(), 100);
}

function closeViopSirketNakitModal() {

    document.getElementById('viop-sirket-nakit-input').value = '';
}

function formatNakitInput(input) {

    console.log('💾 Nakit verileri kaydediliyor...');
    
    // C8-C14 (7 input) değerlerini topla (index 6-12)
    const values = [];
    for (let i = 6; i <= 12; i++) {  // 6-12 (7 değer)

        if (!input) continue;

    console.log('📊 Kaydedilecek değerler (C8-C14):', values);
    
    if (values.length !== 7) {  // 7 değer olmalı
        alert('⚠️ Tüm alanlar doldurulmalı!');

    }
    
    try {
        // Apps Script Web App üzerinden Google Sheets'e yaz
        const response = await fetch(
            `${APPS_SCRIPT_URL}?action=updateNakitBulk&values=${values.join(',')}`,
            {

            }

        alert('❌ Kaydetme sırasında bir hata oluştu!\n\n' + error.message);
    }

function updateNakitDetailModal() {
    console.log('📊 Nakit Detail Modal güncelleniyor...');
    
    if (!nakitData || nakitData.length < 3) {
        console.warn('⚠️ NAKİT data yeterli değil!');
        return;
    }
    
    // USDTRY kurunu al
    const usdtry = marketData['USDTRY'] || 42.84;
    
    // ŞAHSİ Nakit (Row 2 - index 1)
    let sahsiTL = 0;
    let sahsiUSD = 0;
    
    // ŞİRKET Nakit (Row 3 - index 2)
    let sirketTL = 0;
    let sirketUSD = 0;
    
    // NAKİT verisini işle
    for (let i = 1; i < nakitData.length; i++) {
        const row = nakitData[i];
        if (!row || row.length < 3) continue;
        
        const hesap = (row[0] || '').toString().trim().toUpperCase();
        
        if (hesap.includes('SAHSI') || hesap.includes('ŞAHSİ')) {
            // ŞAHSİ
            const tlValue = row[1] || '';
            const usdValue = row[2] || '';
            
            // TL parse - sadece rakam içeriyorsa direkt parse
            const tlStr = tlValue.toString().trim();
            if (/^\d+$/.test(tlStr)) {
                // Sadece rakamlar varsa (26000)
                sahsiTL = parseInt(tlStr);
            } else {
                sahsiTL = parseNumberSmart(tlValue);
            }
            
            sahsiUSD = parseUSD(usdValue);
            
            console.log('✅ ŞAHSİ NAKİT:', { sahsiTL, sahsiUSD });
            
        } else if (hesap.includes('SIRKET') || hesap.includes('ŞİRKET')) {
            // ŞİRKET
            const tlValue = row[1] || '';
            const usdValue = row[2] || '';
            
            // TL parse - sadece rakam içeriyorsa direkt parse
            const tlStr = tlValue.toString().trim();
            if (/^\d+$/.test(tlStr)) {
                // Sadece rakamlar varsa (7235000)
                sirketTL = parseInt(tlStr);
            } else {
                sirketTL = parseNumberSmart(tlValue);
            }
            
            sirketUSD = parseUSD(usdValue);
            
            console.log('✅ ŞİRKET NAKİT:', { sirketTL, sirketUSD });
        }
    }
    
    // Toplam TL hesapla (ŞAHSİ artık sadece TL)
    const totalTL = sahsiTL + sirketTL + (sirketUSD * usdtry);
    
    // Modal elementlerini güncelle
    document.getElementById('modal-sahsi-tl').textContent = formatCurrency(sahsiTL);
    
    document.getElementById('modal-sirket-tl').textContent = formatCurrency(sirketTL);
    document.getElementById('modal-sirket-usd').textContent = '$' + formatNumber(sirketUSD);
    
    document.getElementById('modal-total-tl').textContent = formatCurrency(totalTL);
    
    console.log('✅ Nakit Detail Modal güncellendi:', { 
        sahsiTL, 
        sahsiUSD, 
        sirketTL, 
        sirketUSD, 
        totalTL,
        usdtry
    });
}

// Kontrat adından vade parse et (XAGUSDJ2026 → Nisan 2026)
function parseKontratVade(kontratAdi) {
    if (!kontratAdi) return null;
    
    const monthCodes = {
        'F': 'Ocak', 'G': 'Şubat', 'H': 'Mart',
        'J': 'Nisan', 'K': 'Mayıs', 'M': 'Haziran',
        'N': 'Temmuz', 'Q': 'Ağustos', 'U': 'Eylül',
        'V': 'Ekim', 'X': 'Kasım', 'Z': 'Aralık'
    };
    
    // XAGUSDJ2026 formatını parse et
    const match = kontratAdi.match(/([FGHJKMNQUVXZ])(\d{4})$/);
    if (match) {
        const monthCode = match[1];
        const year = match[2];
        const monthName = monthCodes[monthCode];
        return monthName ? `${monthName} ${year}` : null;
    }
    
    return null;
}

// YENİ: W sütunundaki sebep'i parse et
function parseSebep(sebep) {
    console.log('🔍 parseSebep çağrıldı, sebep uzunluğu:', sebep ? sebep.length : 0);
    console.log('🔍 İlk 200 karakter:', sebep ? sebep.substring(0, 200) : 'BOŞ');
    
    if (!sebep) return {};
    
    const result = {
        fiyat_stratejisi: {},
        kademe_sebep: '',          // YENİ - [FİYAT STRATEJİSİ] bölümü
        tam_analiz: '',            // YENİ - [MAKRO] ve sonrası
        mum_pattern: '',
        mum_analizi: '',           // YENİ - TAM MUM ANALİZİ
        son_5_mum_text: '',        // YENİ - "yeşil-yeşil-kırmızı..."
        smart_money_detay: '',
        makro_detay: '',
        teknik_detay: ''
    };
    
    // AKILLI PARSE FONKSIYONU (Türk ve Amerikan formatlarını destekler)
    function parseSmartNumber(str) {
        if (!str) return 0;
        
        // Virgül VE nokta varsa, hangisi en sondaysa ondalık ayraç
        const hasComma = str.includes(',');
        const hasDot = str.includes('.');
        
        if (hasComma && hasDot) {
            const lastComma = str.lastIndexOf(',');
            const lastDot = str.lastIndexOf('.');
            
            if (lastComma > lastDot) {
                // Türk: "9.059,50" → nokta binlik, virgül ondalık
                return parseFloat(str.replace(/\./g, '').replace(',', '.'));
            } else {
                // Amerikan: "9,059.50" → virgül binlik, nokta ondalık
                return parseFloat(str.replace(/,/g, ''));
            }
        } else if (hasComma) {
            // Sadece virgül var
            // "92,43" veya "9059,50" → Türk format
            return parseFloat(str.replace(',', '.'));
        } else if (hasDot) {
            // Sadece nokta var — birden fazla nokta VEYA son gruptaki basamak sayısı TAM 3 ise
            // bu bir Türk binlik ayıracıdır (ör. "350.000" → 350000); aksi halde ondalık noktadır
            // (ör. "5.25"). ESKİ HATA: bu dal önceden hiç kontrol etmeden direkt parseFloat
            // yapıyordu — "350.000" gibi değerleri 350'ye düşürüyordu.
            const parts = str.split('.');
            const lastGroup = parts[parts.length - 1];
            if (parts.length > 2 || lastGroup.length === 3) {
                return parseFloat(str.replace(/\./g, ''));
            }
            return parseFloat(str);
        } else {
            // Ayraç yok
            return parseFloat(str);
        }
    }
    
    // W sütununu 2 parçaya ayır (16.01.2026 - REGEX İLE DÜZELTİLDİ)
    const makroMatch = sebep.match(/\[MAKRO\]:/);
    if (makroMatch) {
        result.kademe_sebep = sebep.substring(0, makroMatch.index).trim();
        result.tam_analiz = sebep.substring(makroMatch.index).trim();
    } else {
        result.kademe_sebep = '';
        result.tam_analiz = sebep;
    }
    
    // [FİYAT STRATEJİSİ] parse et - DÜZELTİLMİŞ REGEX (TÜRKÇE/İNGİLİZCE)
    const fiyatMatch = sebep.match(/Agresif:\s*\$?([\d,.]+).*?Dengeli:\s*\$?([\d,.]+).*?Sab[ıi]rl[ıi]:\s*\$?([\d,.]+)/is);
    if (fiyatMatch) {
        result.fiyat_stratejisi = {
            agresif: parseSmartNumber(fiyatMatch[1]),
            dengeli: parseSmartNumber(fiyatMatch[2]),
            sabirli: parseSmartNumber(fiyatMatch[3])
        };
        
        // İdeal Giriş, Stop Loss, Destek, Direnç parse et (TÜRKÇE/İNGİLİZCE)
        const idealMatch = sebep.match(/[İi]deal Giri[şs]:\s*\$?([\d,.]+)/i);
        const stopMatch = sebep.match(/Stop Loss:\s*\$?([\d,.]+)/i);
        const destekMatch = sebep.match(/Destek:\s*\$?([\d,.]+)/i);
        const direncMatch = sebep.match(/Diren[çc]:\s*\$?([\d,.]+)/i);
        
        if (idealMatch) result.fiyat_stratejisi.ideal_giris = parseSmartNumber(idealMatch[1]);
        if (stopMatch) result.fiyat_stratejisi.stopLoss = parseSmartNumber(stopMatch[1]);
        if (destekMatch) result.fiyat_stratejisi.destek = parseSmartNumber(destekMatch[1]);
        if (direncMatch) result.fiyat_stratejisi.direnc = parseSmartNumber(direncMatch[1]);
    }
    
    // [KADEME DETAY] parse et (YENİ - 19.01.2026)
    const kademeDetayMatch = sebep.match(/\[KADEME DETAY\]\s*([\s\S]*?)(?=\n\n|\[|$)/i);
    if (kademeDetayMatch) {
        const kademeText = kademeDetayMatch[1].trim();
        const kademeLines = kademeText.split('\n').filter(line => line.trim());
        
        result.fiyat_stratejisi.kademe_detay = kademeLines.map(line => {
            // Örnek: "60% @ $4662 (24 adet) - Ideal"
            const match = line.match(/(\d+)%\s*@\s*\$?([\d,.]+)\s*\((\d+)\s*adet\)/i);
            if (match) {
                return {
                    oran: match[1] + '%',
                    fiyat: parseFloat(match[2].replace(',', '')),
                    adet: parseInt(match[3])
                };
            }
            return null;
        }).filter(k => k !== null);
    }
    
    // 🕯️ MUM PATTERN parse et (ESKİ - EMOJI İLE)
    const mumMatch = sebep.match(/🕯️\s*MUM PATTERN\s*([^\n]+)/i);
    if (mumMatch) {
        result.mum_pattern = mumMatch[1].trim().replace(/\.$/, '');
    }
    
    // SON 5 MUM: parse et (GÜNCEL FORMAT)
    const son5MumMatch = sebep.match(/SON 5 MUM:\s*([^\n]+)/i);
    if (son5MumMatch) {
        result.son_5_mum_text = son5MumMatch[1].trim();
        console.log('✅ SON 5 MUM bulundu:', result.son_5_mum_text);
    } else {
        console.warn('⚠️ SON 5 MUM bulunamadı!');
    }
    
    // [MUM] TAG'İNDEN TAM MUM ANALİZİNİ ÇIKART (ESKİ FORMAT)
    const mumSectionMatch = sebep.match(/\[MUM\]:\s*([^\[]+?)(?=\s*\[TEKNIK\]|\s*\[TEKNİK\]|\s*\[TEKN[İI]K\]|\s*\[SONUC\]|\s*\[FIYAT|$)/is);
    if (mumSectionMatch) {
        result.mum_analizi = mumSectionMatch[1].trim();
    }
    
    // 💰 SMART MONEY parse et
    const smartMatch = sebep.match(/💰\s*SMART MONEY\s*([^\n]+)/i);
    if (smartMatch) {
        result.smart_money_detay = smartMatch[1].trim().replace(/\.$/, '');
    }
    
    // 📊 MAKRO ANALİZ parse et (ESKİ - EMOJI İLE)
    const makroDetailMatch = sebep.match(/📊\s*MAKRO ANALİZ[^•]+([\s\S]+?)(?=⏱️|💰|🕯️|📈|$)/i);
    if (makroDetailMatch) {
        result.makro_detay = makroDetailMatch[1].trim();
    }
    
    // 📈 TEKNİK parse et
    const teknikMatch = sebep.match(/📈\s*TEKNİK\s*([^\n]+(?:\n[^📊💰🕯️⏱️]+)*)/i);
    if (teknikMatch) {
        result.teknik_detay = teknikMatch[1].trim();
    }
    
    return result;
}

// ============================================================================
// WEIGHTED SCORING MODEL - PROFESYONEL TRADER STANDARTLARI (ADIM 1)
// ============================================================================
// calculateWeightedScore() fonksiyonu burada tanımlanacak
// Test: signalsData[0] ile testWeightedScore() çağır
// ============================================================================

/**
 * WEIGHTED SCORE HESAPLAMA MOTORu
 * @param {Object} signal - SIGNALS tablosundan gelen sinyal verisi
 * @returns {Object} { finalScore, isExtremeRSI, weights, breakdown, alerts }
 */
function calculateWeightedScore(signal) {
    // VERİ HAZIRLAMA
    const data = {
        makro: {
            jeopolitik: parseFloat(signal.makro_jeopolitik) || 0,
            arz_talep: parseFloat(signal.makro_arz_talep) || 0,
            sanayi: parseFloat(signal.makro_sanayi) || 0,
            para: parseFloat(signal.makro_para) || 0,
            tarihsel: parseFloat(signal.makro_tarihsel) || 0
        },
        timeframe: {
            h1: (signal.timeframe_1h || 'YATAY').toUpperCase(),
            h4: (signal.timeframe_4h || 'YATAY').toUpperCase(),
            d1: (signal.timeframe_1d || 'YATAY').toUpperCase(),
            w1: (signal.timeframe_1w || 'YATAY').toUpperCase()
        },
        smartMoney: {
            cot_commercial: parseFloat(signal.cot_commercial) || 0,
            gdelt_risk_skor: parseInt(signal.gdelt_risk_skor) || 0,
            gold_silver_ratio: parseFloat(signal.gold_silver_ratio) || 0
        },
        teknik: {
            rsi: parseFloat(signal.rsi) || 50,
            macd_hist: parseFloat(signal.macd_hist) || 0,
            bb_upper: parseFloat(signal.bb_upper) || 0,
            bb_lower: parseFloat(signal.bb_lower) || 0,
            price: parseFloat(signal.price) || 0,
            volume: parseFloat(signal.volume) || 0
        }
    };
    
    // AĞIRLIK BELİRLEME - Dynamic Weighting
    const rsi = data.teknik.rsi;
    const isExtremeRSI = rsi > 75 || rsi < 25;
    
    let weights = { makro: 0.60, timeframe: 0.20, smartMoney: 0.15, teknik: 0.05 };
    
    if (isExtremeRSI) {
        weights = { makro: 0.45, timeframe: 0.20, smartMoney: 0.15, teknik: 0.20 };
        console.log('⚠️ EKSTREM RSI! (', rsi, ') - Ağırlıklar değişti');
    }
    
    // MAKRO SKORU
    const makroScore = (data.makro.jeopolitik + data.makro.arz_talep + data.makro.sanayi + data.makro.para + data.makro.tarihsel) / 5;
    
    // TIMEFRAME SKORU
    const upCount = [data.timeframe.h1, data.timeframe.h4, data.timeframe.d1, data.timeframe.w1].filter(t => t === 'YUKARI').length;
    const timeframeScore = upCount * 25;
    
    // SMART MONEY SKORU
    const commercial = data.smartMoney.cot_commercial;
    const cotScore = commercial > 500 ? 100 : (commercial < -500 ? 0 : 50);
    const gdeltScore = Math.max(0, 100 - data.smartMoney.gdelt_risk_skor);
    
    let ratioScore = 50;
    const ratio = data.smartMoney.gold_silver_ratio;
    if (signal.ticker === 'XAGUSD' && ratio > 0) {
        ratioScore = ratio >= 70 ? 100 : (ratio >= 60 ? 75 : (ratio >= 50 ? 50 : 0));
    }
    const smartMoneyScore = (cotScore + gdeltScore + ratioScore) / 3;
    
    // TEKNİK SKOR
    let rsiScore = (rsi >= 30 && rsi <= 70) ? 75 : (rsi > 70 ? 100 - rsi : rsi);
    const macdScore = data.teknik.macd_hist > 0 ? Math.min(100, 50 + data.teknik.macd_hist * 10) : Math.max(0, 50 + data.teknik.macd_hist * 10);
    
    const price = data.teknik.price, bbU = data.teknik.bb_upper, bbL = data.teknik.bb_lower;
    let bbScore = 50;
    if (price > 0 && bbU > 0 && bbL > 0) {
        bbScore = (price >= bbL && price <= bbU) ? 75 : (price > bbU ? 25 : 100);
    }
    
    const volumeScore = data.teknik.volume > 1000000 ? 75 : (data.teknik.volume > 100000 ? 50 : 25);
    const teknikScore = (rsiScore + macdScore + bbScore + volumeScore) / 4;
    
    // FINAL SCORE
    const finalScore = (makroScore * weights.makro) + (timeframeScore * weights.timeframe) + (smartMoneyScore * weights.smartMoney) + (teknikScore * weights.teknik);
    
    console.log('🎯 FINAL WEIGHTED SCORE:', finalScore.toFixed(2));
    console.log('   Makro:', makroScore.toFixed(2), '×', (weights.makro*100)+'%', '=', (makroScore*weights.makro).toFixed(2));
    console.log('   Timeframe:', timeframeScore, '×', (weights.timeframe*100)+'%', '=', (timeframeScore*weights.timeframe).toFixed(2));
    console.log('   Smart Money:', smartMoneyScore.toFixed(2), '×', (weights.smartMoney*100)+'%', '=', (smartMoneyScore*weights.smartMoney).toFixed(2));
    console.log('   Teknik:', teknikScore.toFixed(2), '×', (weights.teknik*100)+'%', '=', (teknikScore*weights.teknik).toFixed(2));
    
    return {
        finalScore: finalScore,
        isExtremeRSI: isExtremeRSI,
        weights: weights,
        breakdown: {
            makro: { score: makroScore, weighted: makroScore * weights.makro },
            timeframe: { score: timeframeScore, weighted: timeframeScore * weights.timeframe, uyum: upCount + '/4' },
            smartMoney: { score: smartMoneyScore, weighted: smartMoneyScore * weights.smartMoney },
            teknik: { score: teknikScore, weighted: teknikScore * weights.teknik }
        },
        alerts: {
            extremeRSI: isExtremeRSI,
            goldSilverRatio: (signal.ticker === 'XAGUSD' && ratio < 50) ? 'PENALTY' : null
        }
    };
}

}

// TRADE ADVICE GENERATOR - ADIM 2
// ============================================================================

function generateTradeAdvice(signal, weightedResult) {
    let finalScore = weightedResult.finalScore;
    let advice = 'BEKLE';
    let sebepParts = [];
    let penaltyApplied = false;
    
    // GOLD/SILVER RATIO PENALTY
    if (signal.ticker === 'XAGUSD') {
        const ratio = parseFloat(signal.gold_silver_ratio) || 0;
        if (ratio > 0 && ratio < 50) {
            finalScore = finalScore * 0.80;
            penaltyApplied = true;
            sebepParts.push(`⚠️ GÜMÜŞ PAHALI: Ratio ${ratio.toFixed(1)} (< 50), Skor %20 ceza`);
            advice = 'BEKLE';
        }
    }
    
    // DIVERGENCE TESPİTİ
    const gdeltRisk = parseInt(signal.gdelt_risk_skor) || 0;
    const cotCommercial = parseFloat(signal.cot_commercial) || 0;
    const cotScore = cotCommercial > 500 ? 100 : (cotCommercial < -500 ? 0 : 50);
    let divergenceAlert = null;
    
    if (gdeltRisk < 30 && cotScore < 30) {
        divergenceAlert = 'SÜNİ YÜKSELİŞ';
        sebepParts.push('⚠️ UYUMSUZLUK: Haberler olumlu ama Smart Money satıyor');
    }
    
    // AKSİYON BELİRLEME
    if (!penaltyApplied) {
        const rsi = parseFloat(signal.rsi) || 50;
        if (weightedResult.isExtremeRSI) {
            advice = rsi > 75 ? 'POZİSYONU KORU (AŞIRI ALIM)' : 'GÜVENLİ EKLEME BÖLGESİ (AŞIRI SATIM)';
            sebepParts.push((rsi > 75 ? '🔴 AŞIRI ALIM' : '🟢 AŞIRI SATIM') + ': RSI ' + rsi.toFixed(1));
        } else {
            if (finalScore >= 75) {
                advice = 'TUT/EKLE';
                sebepParts.push('✅ GÜÇLÜ SİNYAL: Skor ' + finalScore.toFixed(1));
            } else if (finalScore >= 50) {
                advice = 'TUT';
                sebepParts.push('🟡 ORTA SİNYAL: Skor ' + finalScore.toFixed(1));
            } else if (finalScore >= 40) {
                advice = 'BEKLE';
                sebepParts.push('🟠 ZAYIF: Skor ' + finalScore.toFixed(1));
            } else {
                advice = 'SAT/KAPAT';
                sebepParts.push('🔴 ÇOK ZAYIF: Skor ' + finalScore.toFixed(1));
            }
        }
    }
    
    // EN ZAYIF BİLEŞEN
    const breakdown = weightedResult.breakdown;
    const components = [
        { name: 'Makro', score: breakdown.makro.score },
        { name: 'Timeframe', score: breakdown.timeframe.score },
        { name: 'Smart Money', score: breakdown.smartMoney.score },
        { name: 'Teknik', score: breakdown.teknik.score }
    ];
    const weakest = components.reduce((prev, curr) => (curr.score < prev.score) ? curr : prev);
    sebepParts.push(`${weakest.name} en zayıf (${weakest.score.toFixed(1)})`);
    
    return {
        advice: advice,
        sebep: sebepParts.join('. '),
        finalScore: finalScore,
        originalScore: weightedResult.finalScore,
        penaltyApplied: penaltyApplied,
        divergenceAlert: divergenceAlert
    };
}

// TEST: Komple analiz (Weighted + Advice)
function testCompleteAnalysis(signal) {
    console.log('\n' + '='.repeat(80));
    console.log('🔬 KOMPLE ANALİZ -', signal.ticker);

// YENİ: Tab'ları oluştur
function renderTabs(tickers, allSignals) {
    const tabsContainer = document.getElementById('ticker-tabs');
    if (!tabsContainer) {
        console.error('❌ ticker-tabs elementi bulunamadı!');
        return;
    }
    
    tabsContainer.innerHTML = '';
    
    // Global değişken: Tüm sinyaller
    window.allSignalsData = allSignals;
    
    tickers.forEach((ticker, index) => {
        const tab = document.createElement('button');
        tab.textContent = ticker;
        tab.style.cssText = `
            padding: 8px 16px;
            background: ${index === 0 ? 'linear-gradient(135deg, #3b82f6, #8b5cf6)' : 'rgba(255, 255, 255, 0.1)'};
            color: #fff;
            border: 2px solid ${index === 0 ? '#3b82f6' : 'rgba(255, 255, 255, 0.2)'};
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        `;
        
        // Hover efekti
        tab.onmouseenter = function() {
            if (!this.classList.contains('active-tab')) {
                this.style.background = 'rgba(255, 255, 255, 0.2)';
                this.style.borderColor = 'rgba(59, 130, 246, 0.5)';
                this.style.transform = 'translateY(-2px)';
            }
        };
        
        tab.onmouseleave = function() {
            if (!this.classList.contains('active-tab')) {
                this.style.background = 'rgba(255, 255, 255, 0.1)';
                this.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                this.style.transform = 'translateY(0)';
            }
        };
        
        // Tıklama
        tab.onclick = function() {
            // Tüm tab'ları pasif yap
            tabsContainer.querySelectorAll('button').forEach(btn => {
                btn.style.background = 'rgba(255, 255, 255, 0.1)';
                btn.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                btn.classList.remove('active-tab');
            });
            
            // Bu tab'ı aktif yap
            this.style.background = 'linear-gradient(135deg, #3b82f6, #8b5cf6)';
            this.style.borderColor = '#3b82f6';
            this.classList.add('active-tab');
            
            // Son seçilen ticker'ı kaydet
            localStorage.setItem('lastSelectedTicker', ticker);
            
            // İçeriği güncelle
            loadTickerContent(ticker);
        };
        
        if (index === 0) {
            tab.classList.add('active-tab');
        }
        
        tabsContainer.appendChild(tab);
    });
    
    // Son seçilen ticker'ı yükle (veya ilk ticker)
    if (tickers.length > 0) {
        const lastTicker = localStorage.getItem('lastSelectedTicker');
        const tickerToLoad = (lastTicker && tickers.includes(lastTicker)) ? lastTicker : tickers[0];
        
        // Doğru tab'ı aktif yap
        const tabs = tabsContainer.querySelectorAll('button');
        tabs.forEach((tab, i) => {
            if (tickers[i] === tickerToLoad) {
                tab.style.background = 'linear-gradient(135deg, #3b82f6, #8b5cf6)';
                tab.style.borderColor = '#3b82f6';
                tab.classList.add('active-tab');
            } else {
                tab.style.background = 'rgba(255, 255, 255, 0.1)';
                tab.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                tab.classList.remove('active-tab');
            }
        });
        
        // İçeriği HEMEN yükle (requestAnimationFrame kullanma)
        loadTickerContent(tickerToLoad);
        console.log('✅ Son seçilen ticker yüklendi:', tickerToLoad);
    }
}

async function loadTickerContent(ticker) {
    try {
        console.log('🔄 Ticker yükleniyor:', ticker);
        const analysisPromise = fetch(`${APPS_SCRIPT_URL}?action=getSignalRowByTicker&ticker=${encodeURIComponent(ticker)}&_=${Date.now()}`)
            .then(function (r) { return r.json(); })
            .catch(function (error) {
                console.error('❌ getSignalRowByTicker API hatası:', error);
                return null;
            });
        var fallbackSignals = window.allSignalsData && Array.isArray(window.allSignalsData)
            ? window.allSignalsData
            : (typeof signalsData !== 'undefined' ? signalsData : []);
        var fallbackSignal = fallbackSignals.find(function (s) { return s.ticker === ticker; });
        var analysis = await analysisPromise;
        if (!analysis || analysis.status !== 'success') {
            console.error('❌ Analiz JSON alınamadı veya hata döndü:', analysis && analysis.message ? analysis.message : '');
            if (fallbackSignal) {
                console.log('⚠️ Fallback: Eski sinyal yapısı ile render ediliyor');
                renderAnalizBox(fallbackSignal);
                renderKisiselAnalizBox(fallbackSignal);
                renderPozisyonlarBox(fallbackSignal);
            }
            return;
        }

            box.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:30px;font-size:15px;">Bu ticker için karar metni bulunamadı.</div>';

        }
        var lines = text.split('\n').map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
        if (!lines.length) {
            box.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:30px;font-size:15px;">Bu ticker için karar metni bulunamadı.</div>';
            return;
        }
        var html = '<div style="background:rgba(15,23,42,0.9);border-radius:14px;padding:14px 16px;border:1px solid rgba(129,140,248,0.6);box-shadow:0 10px 25px rgba(15,23,42,0.8);font-size:13px;line-height:1.6;">';
        lines.forEach(function (line, idx) {
            if (idx === 0) {
                html += '<div style="font-size:14px;font-weight:700;color:#e5e7eb;margin-bottom:4px;">' + line + '</div>';
            } else if (idx === 1 && line.indexOf('KARAR:') === 0) {
                html += '<div style="font-size:13px;font-weight:600;color:#c7d2fe;margin-bottom:8px;">' + line + '</div>';
            } else if (line.indexOf('- ') === 0) {
                html += '<div style="font-size:13px;color:#e5e7eb;margin-left:4px;">' + line + '</div>';
            } else if (line.indexOf('IF ') === 0) {
                html += '<div style="font-size:12px;color:#a5b4fc;margin-top:2px;">' + line + '</div>';
            } else if (line.indexOf('Pozisyon:') === 0) {
                html += '<div style="font-size:13px;color:#f9fafb;margin-top:8px;">' + line + '</div>';
            } else if (line.indexOf('Stop:') === 0 || line.indexOf('H1:') === 0 || line.indexOf('H2:') === 0) {
                html += '<div style="font-size:12px;color:#e5e7eb;margin-top:2px;">' + line + '</div>';
            } else {
                html += '<div style="font-size:13px;color:#e5e7eb;">' + line + '</div>';
            }
        });
        html += '</div>';
        box.innerHTML = html;
    } catch (error) {

async function loadMkkYabanciOrani() {
    try {
        if (localStorage.getItem('mkk_popup_closed_' + new Date().toDateString())) return;
        const text = await fetchSheetCSV('MKK_YABANCIORAN');
        const rows = text.trim().split("\n").map(r => { const cols = []; let inQ = false, cur = ""; for (let i = 0; i < r.length; i++) { if (r[i] === "\"") inQ = !inQ; else if (r[i] === "," && !inQ) { cols.push(cur.trim()); cur = ""; } else cur += r[i]; } cols.push(cur.trim()); return cols; });
        if (rows.length < 2) return;
        const son = rows[rows.length - 1];
        const tarih = son[0] || '';
        const yabanci = parseFloat((son[1] || "0").replace(",", ".")) || 0;
        const yerli = parseFloat((son[2] || "0").replace(",", ".")) || 0;
        const gunlukD = son[3] ? parseFloat(son[3].replace(",", ".")) : null;
        document.getElementById('mkk-popup-tarih').textContent = tarih;
        document.getElementById('mkk-popup-yabanci').textContent = '%' + yabanci.toFixed(2).replace('.', ',');
        document.getElementById('mkk-popup-yerli').textContent = '%' + yerli.toFixed(2).replace('.', ',');
        if (gunlukD !== null && !isNaN(gunlukD) && gunlukD !== 0) {
            const isUp = gunlukD > 0;
            const yDelta = document.getElementById('mkk-popup-yabanci-delta');
            const yrDelta = document.getElementById('mkk-popup-yerli-delta');
            yDelta.textContent = (isUp ? '▲ +' : '▼ ') + Math.abs(gunlukD).toFixed(2).replace('.', ',');
            yDelta.style.background = isUp ? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)';
            yDelta.style.color = isUp ? '#4ade80' : '#f87171';
            yDelta.style.display = 'inline-block';
            yrDelta.textContent = (isUp ? '▼ -' : '▲ +') + Math.abs(gunlukD).toFixed(2).replace('.', ',');
            yrDelta.style.background = isUp ? 'rgba(248,113,113,0.15)' : 'rgba(74,222,128,0.15)';
            yrDelta.style.color = isUp ? '#f87171' : '#4ade80';
            yrDelta.style.display = 'inline-block';
        }
        document.getElementById('mkk-popup').style.display = 'block';
    } catch(e) {
        console.log('MKK popup hata:', e);
    }
}
